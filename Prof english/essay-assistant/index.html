<script>
/* Essay Writing Assistant — right-hand panel: word meters, feedback, vocabulary, source, rewrites, Claude tutor */
"use strict";

/* ---------- meters and outline ---------- */
function renderMeters() {
  const r = S.result;
  const len = L();
  const scale = len.max * 1.2;
  const total = $("#total");
  total.replaceChildren(
    h("span", { class: "eyebrow" }, "Total length"),
    h("div", { class: "big" }, String(r.total), h("small", {}, `of ${len.min}–${len.max} words`)),
    h("div", { class: "meter", id: "m-total" }, h("i")));
  const st = setMeter($("#m-total"), r.total, len.min, len.max, scale);
  total.append(h("span", { class: "hint" }, r.total === 0 ? "Nothing written yet." : st === "in" ? "Within the target range." : st === "under" ? `${len.min - r.total} words below the minimum.` : `${r.total - len.max} words over the limit.`));

  const ol = $("#outline");
  ol.replaceChildren();
  const paras = S.mode === "review" ? r.paras : visibleSections().map(id => r.paras.find(p => p.id === id) || { id, label: sectionLabel(id), kind: kindOf(id), words: 0, range: RANGES[kindOf(id)] });
  paras.forEach(p => {
    const [lo, hi] = p.range;
    const m = h("div", { class: "meter" }, h("i"));
    const state = setMeter(m, p.words, lo, hi, hi * 1.3);
    ol.append(h("li", {},
      h("span", {}, p.label + (p.id === "body3" ? " (opt.)" : "")),
      m,
      h("span", { class: "count num " + (state || ""), style: "text-align:right" }, `${p.words}/${lo}–${hi}`)));
    const cm = document.getElementById(`m-${p.id}`), cc = document.getElementById(`c-${p.id}`);
    if (cm) { const s2 = setMeter(cm, p.words, lo, hi, hi * 1.3); cc.textContent = `${p.words} / ${lo}–${hi}`; cc.className = "count " + (s2 || ""); }
  });
  const pick = $("#reviewPara");
  if (pick) { const v = pick.value; pick.replaceChildren(...r.paras.map(p => h("option", { value: p.id, text: p.label }))); if (r.paras.some(p => p.id === v)) pick.value = v; }
}

/* ---------- panel tabs ---------- */
function renderPanel() {
  $$(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === S.tab));
  const panel = $("#panel");
  panel.replaceChildren();
  if (S.tab === "feedback") panel.append(...feedbackView());
  if (S.tab === "vocab") panel.append(vocabView());
  if (S.tab === "source") panel.append(sourceView());
}

const SEV_ORDER = { fix: 0, warn: 1, ok: 2 };
function feedbackView() {
  const nodes = [];
  if (S.proposal) nodes.push(proposalView());
  const r = S.result;
  let list = r.issues.slice();
  if (S.scope) list = list.filter(i => i.para === S.scope);
  const counts = { all: list.length, fix: list.filter(i => i.sev === "fix").length, warn: list.filter(i => i.sev === "warn").length, ok: list.filter(i => i.sev === "ok").length };
  const labels = { all: "All", fix: "To fix", warn: "Suggestions", ok: "Done well" };
  nodes.push(h("div", { class: "filters", role: "group", "aria-label": "Filter feedback" },
    Object.keys(labels).map(k => h("button", { type: "button", "aria-pressed": S.filter === k, onclick: () => { S.filter = k; renderPanel(); } }, `${labels[k]} `, h("span", { class: "num" }, String(counts[k]))))));
  if (S.scope) nodes.push(h("div", { class: "status", style: "background:var(--accent-soft);color:var(--ink);margin-top:8px;align-items:center" },
    h("span", { style: "flex:1" }, "Showing checks for ", h("b", {}, labelFor(S.scope))),
    h("button", { type: "button", class: "btn ghost", onclick: () => { S.scope = null; renderPanel(); } }, "Show all")));
  if (S.filter !== "all") list = list.filter(i => i.sev === S.filter);
  list.sort((a, b) => SEV_ORDER[a.sev] - SEV_ORDER[b.sev] || AREAS.indexOf(a.area) - AREAS.indexOf(b.area));

  const notes = h("div", { class: "notes", style: "margin-top:10px" });
  if (!list.length) notes.append(h("p", { class: "empty" }, S.filter === "fix" ? "Nothing to fix in this view." : "No feedback in this view."));
  list.forEach(i => notes.append(noteView(i)));
  nodes.push(notes);

  nodes.push(h("div", { class: "ai-only", style: "margin-top:14px;display:grid;gap:8px" },
    h("button", { type: "button", class: "btn ai", onclick: tutorReview, id: "tutorBtn" }, "Get tutor comments on the full essay"),
    h("span", { class: "hint" }, "Claude comments on meaning, logic and grammar the pattern checks miss. It will not rewrite your essay.")));
  if (S.tutor) nodes.push(tutorView());
  nodes.push(h("p", { class: "hint", style: "margin-top:14px" }, "Checks run in your browser and are pattern-based: they catch common problems, not every error. Your teacher's feedback always takes priority."));
  return nodes;
}

function labelFor(id) { const p = S.result.paras.find(x => x.id === id); return p ? p.label : sectionLabel(id); }

function noteView(i) {
  const go = i.para && S.mode !== "review" ? () => focusPart(i.para, i.key || firstKey(i.para)) : null;
  return h("div", { class: "note " + i.sev },
    h("div", {},
      h("div", { class: "where" }, `${i.area} · ${i.where}`),
      h("p", {}, i.msg),
      i.quote ? h("q", {}, i.quote) : null,
      go ? h("div", { class: "act" }, h("button", { type: "button", class: "btn ghost", style: "padding:2px 6px;font-size:12px", onclick: go }, "Go to text →")) : null));
}
function firstKey(sec) { const k = PARTS[kindOf(sec)].find(p => !(S.essay[sec][p.key] || "").trim()); return (k || PARTS[kindOf(sec)][0]).key; }

function reviewAll() {
  S.scope = null; S.filter = "all"; S.tab = "feedback";
  S.result = analyse(model());
  renderPanel();
  const f = S.result.issues.filter(i => i.sev === "fix").length, w = S.result.issues.filter(i => i.sev === "warn").length;
  toast(`Essay reviewed: ${f} to fix, ${w} suggestions.`);
  if (matchMedia("(max-width:1100px)").matches) $(".margin").scrollIntoView({ behavior: "smooth" });
}

function checkParagraph(id) {
  S.result = analyse(model());
  const p = S.result.paras.find(x => x.id === id);
  if (!p || !p.text) { toast(`${sectionLabel(id)} is empty. Write something first.`); return; }
  S.scope = id; S.filter = "all"; S.tab = "feedback";
  renderPanel();
  const n = S.result.issues.filter(i => i.para === id && i.sev !== "ok").length;
  toast(n ? `${p.label}: ${n} point${n === 1 ? "" : "s"} to look at.` : `${p.label}: no problems found.`);
  if (matchMedia("(max-width:1100px)").matches) $(".margin").scrollIntoView({ behavior: "smooth" });
}

/* ---------- vocabulary ---------- */
function suggestVocab(id) {
  S.vocabFor = id; S.tab = "vocab";
  if (S.mode !== "review" && S.active.sec !== id) S.active = { sec: id, key: firstKey(id) };
  renderPanel();
  if (matchMedia("(max-width:1100px)").matches) $(".margin").scrollIntoView({ behavior: "smooth" });
}

function vocabView() {
  const wrap = h("div", { class: "vocab" });
  let order = Object.keys(VOCAB);
  let lead = "Click a phrase to insert it at the cursor. Replace “…” with your own words.";
  if (S.mode !== "review") {
    const part = partDef(S.active);
    const preferred = part.vocab;
    order = preferred.concat(order.filter(k => !preferred.includes(k)));
    lead = `Inserting into ${sectionLabel(S.active.sec)} → ${part.label}. Phrases for this part come first.`;
  }
  wrap.append(h("p", { class: "hint", style: "margin:0" }, lead));
  order.forEach(k => {
    const g = VOCAB[k];
    wrap.append(h("div", {}, h("h3", {}, g.title),
      h("ul", {}, g.items.map(s => h("li", {}, h("button", { type: "button", onclick: () => insertPhrase(s) }, fillCitation(s)))))));
  });
  const flagged = S.result.issues.filter(i => i.area === "Academic style" && /^Replace/.test(i.msg) && (!S.vocabFor || i.para === S.vocabFor));
  if (flagged.length) wrap.append(h("div", {}, h("h3", {}, "Words to upgrade in " + (S.vocabFor ? labelFor(S.vocabFor) : "your essay")),
    h("div", { class: "notes", style: "margin-top:6px" }, flagged.map(noteView))));
  return wrap;
}

/* ---------- source ---------- */
function sourceView() {
  const wrap = h("div", { style: "display:grid;gap:10px" });
  const src = S.settings.srcText || "";
  if (countWords(src) < 15) {
    wrap.append(h("div", { class: "status warn" }, "No article is loaded, so the assistant cannot check that your references are accurate or that the article really says what you report. It will never invent content from a source. Upload the article or paste its text on the left."));
    return wrap;
  }
  const cite = [S.settings.srcAuthor, S.settings.srcYear && `(${S.settings.srcYear})`].filter(Boolean).join(" ");
  wrap.append(h("div", {}, h("span", { class: "eyebrow" }, "Loaded source"), h("p", { style: "margin:4px 0 0;font:15px/1.4 var(--serif)" }, cite ? `${cite}. ` : "", h("i", {}, S.settings.srcTitle || "Untitled article"))));
  if (S.mode === "review" || !S.active.sec.startsWith("body")) {
    wrap.append(h("p", { class: "hint", style: "margin:0" }, "Click into a body paragraph's Point to see sentences from the article related to it."));
    return wrap;
  }
  const sec = S.active.sec;
  const query = [S.essay[sec].point, S.essay[sec].evidence].join(" ");
  const hits = sourceMatches(src, query, 3);
  wrap.append(h("h2", {}, `Article sentences related to ${labelFor(sec)}`));
  if (!query.trim()) wrap.append(h("p", { class: "empty" }, "Write the Point first; matching sentences will appear here."));
  else if (!hits.length) wrap.append(h("p", { class: "empty" }, "No sentence in the article shares key words with this point. Check whether the article supports it."));
  else wrap.append(h("div", { class: "src-hits" }, hits.map(s => h("div", { style: "display:grid;gap:4px" },
    h("blockquote", {}, s),
    h("div", { style: "display:flex;gap:6px;flex-wrap:wrap" },
      h("button", { type: "button", class: "btn", onclick: () => useEvidence(sec, s, true) }, "Quote it"),
      h("button", { type: "button", class: "btn ghost", onclick: () => useEvidence(sec, s, false) }, "Start a paraphrase"))))));
  wrap.append(h("p", { class: "hint", style: "margin:0" }, "These sentences are copied from your article, not generated. A paraphrase in your own words usually scores better than a long quotation."));
  return wrap;
}
function useEvidence(sec, sentence, quote) {
  const a = S.settings.srcAuthor || "[Author]", y = S.settings.srcYear || "[Year]";
  const style = S.settings.citation;
  const text = quote
    ? (style === "MLA" ? `${a} states that “${sentence.replace(/\.$/, "")}” (page).` : `${a} (${y}) state that “${sentence.replace(/\.$/, "")}” (p. page).`)
    : (style === "MLA" ? `According to ${a}, …` : `According to ${a} (${y}), …`);
  S.essay[sec].evidence = text;
  renderDesk(); changed();
  focusPart(sec, "evidence");
  toast(quote ? "Quotation added. Replace “page” with the page number." : "Now explain the finding in your own words.");
}

/* ---------- Simplify / Upgrade proposals ---------- */
function propose(id, kind) {
  const fn = kind === "simplify" ? t => simplifyText(t, S.settings.level) : upgradeText;
  let before, after, changes, parts = null;
  if (S.mode === "review") {
    const p = analyse(model()).paras.find(x => x.id === id);
    if (!p || !p.text) { toast("That paragraph is empty."); return; }
    const r = fn(p.text);
    before = p.text; after = r.text; changes = r.changes;
  } else {
    parts = {}; changes = [];
    PARTS[kindOf(id)].forEach(pd => {
      const t = S.essay[id][pd.key] || "";
      const r = fn(t);
      parts[pd.key] = r.text; changes.push(...r.changes);
    });
    before = PARTS[kindOf(id)].map(pd => S.essay[id][pd.key]).filter(Boolean).join(" ");
    after = PARTS[kindOf(id)].map(pd => parts[pd.key]).filter(Boolean).join(" ");
    if (!before.trim()) { toast(`${sectionLabel(id)} is empty. Write something first.`); return; }
  }
  S.proposal = { id, kind, before, after, changes, parts, source: "rules" };
  S.tab = "feedback"; renderPanel();
  if (matchMedia("(max-width:1100px)").matches) $(".margin").scrollIntoView({ behavior: "smooth" });
}

function proposalView() {
  const P = S.proposal;
  const title = (P.kind === "simplify" ? "Simplify" : "Upgrade to C1") + " · " + labelFor(P.id);
  const box = h("section", { class: "proposal", "aria-label": title }, h("span", { class: "eyebrow" }, title + (P.source === "claude" ? " · by Claude" : "")));
  if (!P.changes.length) {
    box.append(h("p", { class: "empty" }, P.kind === "simplify" ? "The built-in rules found nothing to simplify." : "The built-in rules found no informal words to replace."));
  } else {
    box.append(h("div", { class: "txt" }, markChanges(P.after, P.changes)));
    box.append(h("div", {}, h("span", { class: "lbl" }, "What changed and why"),
      h("ol", {}, P.changes.map(c => h("li", {}, h("del", {}, c.from), " → ", h("ins", {}, c.to), ". ", c.why)))));
  }
  box.append(h("div", { class: "acts" },
    P.changes.length ? h("button", { type: "button", class: "btn primary", onclick: acceptProposal }, "Apply changes") : null,
    h("button", { type: "button", class: "btn ai ai-only", onclick: () => claudeRewrite(P.id, P.kind) }, "Ask Claude for a better version"),
    h("button", { type: "button", class: "btn ghost", onclick: () => { S.proposal = null; renderPanel(); } }, "Dismiss")));
  box.append(h("span", { class: "hint" }, "Only wording changes. Your ideas and evidence stay yours."));
  return box;
}
function markChanges(text, changes) {
  const frag = document.createDocumentFragment();
  const targets = [...new Set(changes.map(c => c.to).filter(t => t && !t.includes(" / ")))].sort((a, b) => b.length - a.length);
  if (!targets.length) { frag.append(text); return frag; }
  const re = new RegExp("(" + targets.map(esc).join("|") + ")", "gi");
  text.split(re).forEach((seg, i) => frag.append(i % 2 ? h("ins", {}, seg) : seg));
  return frag;
}
function acceptProposal() {
  const P = S.proposal;
  if (P.parts) Object.assign(S.essay[P.id], P.parts);
  else S.reviewText = S.reviewText.replace(P.before, P.after);
  S.proposal = null;
  renderDesk(); changed(); renderPanel();
  toast("Changes applied. Read the paragraph again to make sure it still says what you mean.");
}

/* ---------- Claude tutor (only when the page runs inside a Claude viewer) ---------- */
let sampleFn = null;
if (window.claude && typeof window.claude.use === "function") {
  window.claude.use("sample").then(fn => { if (fn) { sampleFn = fn; document.body.classList.add("has-ai"); } }).catch(() => {});
}
function aiFail(e, out) {
  const code = e && e.code;
  if (code === "cancelled") return;
  if (["not_granted", "sampling_disabled", "not_declared", "capability_disabled", "capability_removed"].includes(code)) {
    document.body.classList.remove("has-ai"); sampleFn = null;
    toast("The Claude tutor is not available here. The built-in checks still work.");
  } else if (code === "rate_limited") toast("Too many tutor requests. Wait a minute and try again.");
  else toast("The tutor could not answer. Try again.");
  if (out) out.hidden = true;
}
function contextBlock() {
  const s = S.settings;
  const src = (s.srcText || "").trim();
  return `ASSIGNMENT
Topic: ${s.topic || "(not given)"}
Task: ${s.prompt || "(not given)"}
Essay type: ${TYPES[s.type].name}. Target: ${s.length} words, CEFR level ${s.level}, citation style ${s.citation}.
Required content: ${s.required || "(none)"}
SOURCE: ${src ? `${s.srcAuthor || "Unknown author"} (${s.srcYear || "n.d."}) "${s.srcTitle || ""}". Text supplied by the student (may be partial):\n"""${src.slice(0, 7000)}"""` : "NO SOURCE TEXT WAS PROVIDED. You cannot verify any citation or claim attributed to a source, and you must not state what any source says."}`;
}

async function askTutor(id) {
  if (!sampleFn) return;
  const out = document.getElementById(`ai-${id}`);
  const part = partDef(S.active.sec === id ? S.active : { sec: id, key: firstKey(id) });
  const current = PARTS[kindOf(id)].map(p => `${p.label}: ${S.essay[id][p.key] || "(empty)"}`).join("\n");
  out.hidden = false; out.textContent = "Thinking…";
  try {
    await sampleFn(`You are a writing tutor helping a university student write an academic English essay THEMSELVES. Never write sentences, arguments or evidence for the student. Ask 2 or 3 short Socratic questions (plain English at ${S.settings.level} level) that help them develop the part "${part.label}" of their ${sectionLabel(id)}, then give one practical tip. Refer to what they have already written. Do not quote or describe a source unless the text is given below. Plain text, no headings, under 110 words.

${contextBlock()}

THESIS SO FAR: ${S.essay.intro.thesis || "(empty)"}
${sectionLabel(id).toUpperCase()} SO FAR:
${current}`, { modelTier: "quick", onText: ({ text }) => { out.textContent = text; } });
  } catch (e) { aiFail(e, out); }
}

async function claudeRewrite(id, kind) {
  if (!sampleFn) return;
  const btn = $(".proposal .btn.ai");
  if (btn) { btn.disabled = true; btn.textContent = "Thinking…"; }
  const goal = kind === "simplify" ? `Make the wording clearer and simpler for a ${S.settings.level === "C1" ? "B2" : S.settings.level} reader: shorter sentences, common words.` : "Raise the wording to C1 academic register: precise vocabulary, cautious academic phrasing, varied linking, no contractions.";
  const structured = S.mode !== "review";
  const input = structured ? JSON.stringify(Object.fromEntries(PARTS[kindOf(id)].map(p => [p.key, S.essay[id][p.key] || ""]))) : JSON.stringify({ paragraph: S.proposal.before });
  try {
    const r = await sampleFn.json(`Improve the WORDING ONLY of one paragraph from a student's academic essay. ${goal}
Rules: keep every idea, claim, example and citation the student wrote; add no new arguments, facts, examples or statistics; never add or change what a source says; keep empty fields empty; keep roughly the same length.
Reply with only JSON: {"revised": <object with exactly the same keys as the input, each a string>, "changes": [{"from": "original words", "to": "new words", "why": "one short reason a student understands"}]} — at most 8 changes.

${contextBlock()}

INPUT (${sectionLabel(id)}): ${input}`);
    if (!r || typeof r.revised !== "object" || !Array.isArray(r.changes)) throw { code: "upstream_error" };
    const parts = structured ? Object.fromEntries(PARTS[kindOf(id)].map(p => [p.key, String(r.revised[p.key] ?? S.essay[id][p.key] ?? "")])) : null;
    const after = structured ? Object.values(parts).filter(Boolean).join(" ") : String(r.revised.paragraph || S.proposal.before);
    S.proposal = { id, kind, before: S.proposal.before, after, parts, source: "claude",
      changes: r.changes.slice(0, 8).map(c => ({ from: String(c.from || ""), to: String(c.to || ""), why: String(c.why || "") })) };
    renderPanel();
  } catch (e) { aiFail(e); if (btn) { btn.disabled = false; btn.textContent = "Ask Claude for a better version"; } }
}

async function tutorReview() {
  if (!sampleFn) return;
  const btn = $("#tutorBtn");
  const text = S.mode === "review" ? S.reviewText : essayToText(S.essay, L().extra);
  if (!text.trim()) { toast("Write or paste your essay first."); return; }
  btn.disabled = true; btn.textContent = "Reading your essay…";
  try {
    const r = await sampleFn.json(`You are an academic English tutor reviewing a student's essay. Give feedback only; do NOT rewrite the essay. You may suggest a better version of at most two individual sentences, and must explain what changed.
Check: clarity of thesis, fit to the essay type, PEEL structure of body paragraphs, whether explanations really support the points, relevance to the task, grammar errors, academic register, and whether claims attributed to the source are supported by the source text. If no source text is provided, include one comment saying the references cannot be verified. Never state what the source says beyond the supplied text.
Reply with only a JSON array of at most 8 objects: {"severity": "fix"|"warn"|"ok", "area": short label, "where": "Introduction"|"Body Paragraph 1"|...|"Conclusion"|"Whole essay", "quote": exact words from the essay or "", "comment": plain ${S.settings.level}-level English, max 40 words, "suggestion": optional improved sentence or ""}.

${contextBlock()}

ESSAY:
"""${text.slice(0, 9000)}"""`, { modelTier: "default" });
    if (!Array.isArray(r)) throw { code: "upstream_error" };
    S.tutor = r.slice(0, 8);
    renderPanel();
  } catch (e) { aiFail(e); btn.disabled = false; btn.textContent = "Get tutor comments on the full essay"; }
}

function tutorView() {
  return h("div", { class: "notes ai-only", style: "margin-top:12px;display:grid" },
    h("h2", {}, "Tutor comments ", h("span", { class: "hint" }, "by Claude")),
    S.tutor.map(c => h("div", { class: "note " + (["fix", "warn", "ok"].includes(c.severity) ? c.severity : "warn") },
      h("div", {},
        h("div", { class: "where" }, `${c.area || "Tutor"} · ${c.where || "Whole essay"}`),
        h("p", {}, String(c.comment || "")),
        c.quote ? h("q", {}, String(c.quote)) : null,
        c.suggestion ? h("p", { style: "font:italic 14px/1.45 var(--serif);color:var(--ok)" }, "Possible version: " + c.suggestion) : null))));
}

init();

</script>
