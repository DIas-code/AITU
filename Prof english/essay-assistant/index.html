<title>Essay Writing Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&display=swap">
<style>
:root{
  --ground:#E6EAF0; --paper:#FBFCFD; --sunk:#F1F4F8; --ink:#17202E; --ink-2:#4A5568; --ink-3:#6E7A8C;
  --rule:#D3DAE4; --rule-2:#E3E8EF; --accent:#2A4BB0; --accent-ink:#FFFFFF; --accent-soft:#E4EAFA;
  --ok:#2E7650; --ok-soft:#E2F1E8; --warn:#9A5F0C; --warn-soft:#FBF0DC; --fix:#B3261E; --fix-soft:#FBE6E4;
  --band:#DCE4F6; --shadow:0 1px 2px rgba(23,32,46,.06),0 4px 14px rgba(23,32,46,.05);
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1218; --paper:#171C25; --sunk:#12161E; --ink:#E3E8F0; --ink-2:#B3BCCA; --ink-3:#8793A5;
    --rule:#2B3342; --rule-2:#232A36; --accent:#9AAFF3; --accent-ink:#0E1218; --accent-soft:#222C47;
    --ok:#7CC79C; --ok-soft:#1A2E24; --warn:#E3B465; --warn-soft:#33291A; --fix:#F0928A; --fix-soft:#3A1F1E;
    --band:#243052; --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1218; --paper:#171C25; --sunk:#12161E; --ink:#E3E8F0; --ink-2:#B3BCCA; --ink-3:#8793A5;
  --rule:#2B3342; --rule-2:#232A36; --accent:#9AAFF3; --accent-ink:#0E1218; --accent-soft:#222C47;
  --ok:#7CC79C; --ok-soft:#1A2E24; --warn:#E3B465; --warn-soft:#33291A; --fix:#F0928A; --fix-soft:#3A1F1E;
  --band:#243052; --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.eyebrow{font:500 11px/1.2 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:10px 20px;background:var(--paper);border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font:500 22px/1 var(--serif);letter-spacing:-.01em}
.brand h1 i{color:var(--accent)}
.brand span{color:var(--ink-3);font-size:12px}
.modes{display:flex;background:var(--sunk);border:1px solid var(--rule);border-radius:8px;padding:3px;gap:2px}
.modes button{border:0;background:transparent;padding:6px 12px;border-radius:6px;cursor:pointer;color:var(--ink-2);font-weight:500;white-space:nowrap}
.modes button[aria-selected="true"]{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--paper);padding:6px 11px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--sunk)}
.btn[disabled]{opacity:.5;cursor:default}
.btn.ai::before{content:"✦";color:var(--accent);font-size:11px}
.btn.primary.ai::before{color:inherit}

/* shell */
.shell{display:grid;grid-template-columns:minmax(260px,300px) minmax(0,1fr) minmax(280px,340px);gap:0;min-height:calc(100% - 56px)}
.brief,.margin{background:var(--paper);padding:18px 18px 40px;overflow:auto}
.brief{border-right:1px solid var(--rule)}
.margin{border-left:1px solid var(--rule)}
.desk{padding:22px clamp(16px,3vw,40px) 60px;min-width:0}
@media (min-width:1101px){
  .brief,.margin{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));height:calc(100vh - 56px)}
}
@media (max-width:1100px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .brief{border-right:0;border-bottom:1px solid var(--rule)}
  .margin{border-left:0;border-top:1px solid var(--rule)}
}

/* brief panel */
.group{display:grid;gap:10px;padding-block:14px;border-top:1px solid var(--rule-2)}
.group:first-child{border-top:0;padding-top:0}
.group h2{font:600 13px/1.3 var(--sans)}
.field{display:grid;gap:4px}
.field label,.lbl{font-size:12px;font-weight:500;color:var(--ink-2)}
.field small{color:var(--ink-3);font-size:11.5px}
input[type=text],select,textarea{width:100%;background:var(--sunk);border:1px solid var(--rule);border-radius:6px;padding:7px 9px}
input[type=text]:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--paper)}
textarea{resize:vertical;line-height:1.45}
.row2{display:grid;grid-template-columns:1fr 80px;gap:8px}
.seg{display:flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.seg label{flex:1;position:relative;text-align:center;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg span{display:block;padding:6px 4px;font-size:12.5px;font-weight:500;color:var(--ink-2);border-left:1px solid var(--rule)}
.seg label:first-child span{border-left:0}
.seg input:checked+span{background:var(--accent-soft);color:var(--accent)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:-2px}
.file{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.file input{font-size:12px;max-width:100%}
.status{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-radius:6px;font-size:12.5px;line-height:1.4}
.status.warn{background:var(--warn-soft);color:var(--warn)}
.status.ok{background:var(--ok-soft);color:var(--ok)}

/* desk */
.structure{display:grid;gap:10px;margin-bottom:18px}
.structure-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.structure-head h2{font:500 26px/1.15 var(--serif);letter-spacing:-.01em}
.structure-head p{margin:0;color:var(--ink-2);max-width:62ch}
.example-note{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 12px;border:1px dashed var(--rule);border-radius:8px;color:var(--ink-2);font-size:12.5px}
.example-note[hidden]{display:none}
.stages{display:flex;flex-wrap:wrap;gap:6px}
.stage{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 5px;border-radius:999px;background:var(--paper);border:1px solid var(--rule);font-size:12.5px;color:var(--ink-2);cursor:pointer}
.stage b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--sunk);font:500 11px var(--mono);color:var(--ink-3)}
.stage.done b{background:var(--ok-soft);color:var(--ok)}
.stage.active{border-color:var(--accent);color:var(--ink)}
.stage.active b{background:var(--accent);color:var(--accent-ink)}

.cards{display:grid;gap:16px}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow)}
.card-head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 16px;border-bottom:1px solid var(--rule-2)}
.card-head h3{font:500 19px/1.2 var(--serif)}
.card-head .role{color:var(--ink-3);font-size:12.5px;flex:1 1 200px}
.card-body{padding:4px 16px 14px}
.card-foot{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-top:1px solid var(--rule-2);background:var(--sunk);border-radius:0 0 10px 10px}
.card.plan{background:transparent;box-shadow:none;border-style:dashed}
.card.plan .card-foot{background:transparent}
.planner{padding:18px;display:grid;gap:14px;border-color:var(--accent)}
.planner-intro{display:grid;grid-template-columns:minmax(180px,.65fr) minmax(260px,1.35fr);gap:10px 24px;align-items:start}
.planner-intro h3{font:500 24px/1.2 var(--serif);margin-top:3px}.planner-intro p{margin:0;color:var(--ink-2)}
.competence-help{display:grid;gap:4px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);color:var(--ink-2)}.competence-help b{color:var(--accent)}
.idea-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.idea{display:grid;gap:5px;text-align:left;padding:12px;border:1px solid var(--rule);border-radius:8px;background:var(--sunk);cursor:pointer}
.idea b{font-size:13px}.idea span{font:15px/1.35 var(--serif)}.idea small{color:var(--ink-3);line-height:1.35}
.idea:hover{border-color:var(--accent)}.idea.selected{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.choice-work{display:grid;gap:10px}.choice{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;padding:12px;border-top:1px solid var(--rule)}
.choice h4,.choice .hint{grid-column:1/-1;margin:0}.choice label{font-size:12px;font-weight:600;color:var(--ink-2)}.choice textarea{min-height:64px}
.planner-foot{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--ok-soft);color:var(--ok);border-radius:8px}.planner-foot span{color:var(--ink-2)}
@media(max-width:760px){.planner-intro,.choice{grid-template-columns:1fr}.idea-grid{grid-template-columns:1fr 1fr}.choice h4,.choice .hint{grid-column:auto}}
@media(max-width:480px){.idea-grid{grid-template-columns:1fr}}

.part{display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 10px;padding-top:12px}
.mark{grid-row:span 2;display:grid;place-items:center;width:28px;height:28px;border-radius:6px;border:1px solid var(--rule);font:600 13px var(--serif);color:var(--ink-3);background:var(--paper)}
.part.filled .mark{border-color:var(--ok);color:var(--ok)}
.part.active .mark{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.part-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.part-top label{font-weight:600;font-size:13px}
.part-top .q{color:var(--ink-2);font-size:12.5px}
.part textarea{grid-column:2;font:17px/1.55 var(--serif);background:transparent;border:0;border-bottom:1px solid var(--rule);border-radius:0;padding:4px 2px 6px;min-height:36px;resize:none;overflow:hidden}
.part textarea:focus{background:transparent;border-bottom-color:var(--accent)}
.part textarea::placeholder{color:var(--ink-3);font-style:italic}
.part .tools{grid-column:2;display:none;flex-wrap:wrap;gap:6px;align-items:center}
.part.active .tools{display:flex}
.best-start{grid-column:2;display:none;grid-template-columns:minmax(0,1fr);gap:7px;margin:5px 0 3px;padding:10px 11px;border-left:3px solid var(--accent);border-radius:0 6px 6px 0;background:var(--accent-soft)}
.part.active .best-start{display:grid}
.guide-use{margin:0;color:var(--ink-2);font-size:12.5px}.start-options{display:grid;gap:7px}
.completion-help{display:grid;gap:3px;padding:8px 9px;border:1px solid var(--rule);border-radius:6px;background:var(--paper)}
.completion-help b{font-size:12px;color:var(--accent)}.completion-help span{font-size:12px;color:var(--ink-2)}
.completion-help code{white-space:normal;font:italic 14px/1.4 var(--serif);color:var(--ink)}
.start-option{display:grid;gap:2px;padding-top:7px;border-top:1px solid color-mix(in srgb,var(--accent) 20%,transparent)}
.start-option:first-child{padding-top:0;border-top:0}.option-rank{font-size:10.5px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.recommended{width:fit-content;max-width:100%;border:0;background:transparent;padding:0;color:var(--ink);font:italic 15px/1.4 var(--serif);text-align:left;cursor:pointer}
.recommended:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.translation{font-size:12px;color:var(--ink-2)}.best-start small{color:var(--ink-3);font-size:11.5px}
.hint{font-size:12px;color:var(--ink-3)}
.starter{border:1px solid var(--rule);background:var(--sunk);border-radius:999px;padding:2px 9px;font:italic 13px var(--serif);cursor:pointer;color:var(--ink-2)}
.starter:hover{border-color:var(--accent);color:var(--accent)}
.mode-template .part .q,.mode-template .part .hint,.mode-template .starter,.mode-template .best-start{display:none}
.mode-template .part{padding-top:8px}

.review-box{display:grid;gap:10px}
.review-box textarea{min-height:420px;font:17px/1.65 var(--serif);background:var(--paper);padding:18px 20px;border-radius:10px;background-image:linear-gradient(var(--paper),var(--paper))}

.ai-out{margin:10px 16px 14px;padding:10px 12px;border-radius:8px;background:var(--accent-soft);font-size:13.5px;white-space:pre-wrap}
.ai-out[hidden]{display:none}

/* word meter: ruler with target band */
.meter{--pct:0;--lo:0;--hi:0;position:relative;height:8px;border-radius:4px;background:var(--rule-2);min-width:90px;flex:0 1 150px}
.meter::before{content:"";position:absolute;top:0;bottom:0;left:calc(var(--lo)*1%);width:calc((var(--hi) - var(--lo))*1%);background:var(--band);border-radius:2px}
.meter i{position:absolute;top:-3px;width:3px;height:14px;border-radius:2px;left:calc(min(var(--pct),100)*1% - 1px);background:var(--ink-3)}
.meter.in i{background:var(--ok)} .meter.over i{background:var(--fix)} .meter.under i{background:var(--warn)}
.count{font:500 12px var(--mono);color:var(--ink-2);white-space:nowrap}
.count.in{color:var(--ok)} .count.over{color:var(--fix)}

/* margin panel */
.side{display:grid;gap:18px}
.side h2{font:600 13px/1.3 var(--sans);display:flex;align-items:center;gap:8px}
.total{display:grid;gap:8px;padding:14px;border-radius:10px;background:var(--sunk);border:1px solid var(--rule)}
.total .big{font:500 34px/1 var(--serif);font-variant-numeric:tabular-nums}
.total .big small{font:400 13px var(--sans);color:var(--ink-3);margin-left:6px}
.total .meter{flex:none;height:10px}
.outline{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.outline li{display:grid;grid-template-columns:minmax(0,1fr) 70px 56px;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--rule-2);font-size:12.5px}
.outline li .meter{min-width:0}
.outline li span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule)}
.tabs button{border:0;background:transparent;padding:7px 10px;cursor:pointer;color:var(--ink-3);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;padding:0 6px;border-radius:999px;font:500 11px var(--mono)}
.pill.fix{background:var(--fix-soft);color:var(--fix)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.ok{background:var(--ok-soft);color:var(--ok)}
.notes{display:grid;gap:8px}
.note{display:grid;grid-template-columns:4px minmax(0,1fr);gap:0 10px;padding:9px 10px 9px 0;border-radius:6px;background:var(--paper);border:1px solid var(--rule-2)}
.note::before{content:"";border-radius:0 2px 2px 0;background:var(--ink-3)}
.note.fix::before{background:var(--fix)} .note.warn::before{background:var(--warn)} .note.ok::before{background:var(--ok)}
.note .where{font-size:11px;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase}
.note p{margin:2px 0 0;font-size:13px;line-height:1.45}
.note q{display:block;margin-top:4px;font:italic 13.5px/1.4 var(--serif);color:var(--ink-2)}
.note .act{margin-top:6px}
.filters{display:flex;flex-wrap:wrap;gap:4px}
.filters button{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:2px 9px;font-size:12px;cursor:pointer;color:var(--ink-2)}
.filters button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.vocab{display:grid;gap:12px}
.vocab h3{font:600 12px var(--sans);color:var(--ink-2)}
.vocab ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:5px}
.vocab li button{border:1px solid var(--rule);background:var(--paper);border-radius:6px;padding:3px 8px;font:14px var(--serif);cursor:pointer;text-align:left}
.vocab li button:hover{border-color:var(--accent);color:var(--accent)}
.proposal{display:grid;gap:10px;padding:12px;border:1px solid var(--accent);border-radius:10px;background:var(--paper)}
.proposal .txt{font:15.5px/1.55 var(--serif)}
.proposal del{color:var(--fix);text-decoration-thickness:1px}
.proposal ins{color:var(--ok);text-decoration:none;background:var(--ok-soft);border-radius:3px;padding:0 2px}
.proposal ol{margin:0;padding-left:18px;display:grid;gap:4px;font-size:12.5px}
.proposal .acts{display:flex;flex-wrap:wrap;gap:6px}
.empty{color:var(--ink-3);font-size:13px;margin:0}
.src-hits{display:grid;gap:6px}
.src-hits blockquote{margin:0;padding:8px 10px;border-left:2px solid var(--accent);background:var(--sunk);font:14px/1.45 var(--serif)}
body:not(.has-ai) .ai-only{display:none!important}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-size:13px;z-index:50}
.toast[hidden]{display:none}
@media (prefers-reduced-motion:no-preference){.btn,.stage,.starter{transition:border-color .15s,background-color .15s}}
@media (max-width:560px){.topbar{padding:10px 16px}.modes{width:100%}.modes button{flex:1;padding:6px 4px}.brand span{display:none}}
</style>
<header class="topbar">
  <div class="brand"><h1>Essay <i>Writing</i> Assistant</h1><span>Academic English · 200–350 words</span></div>
  <div class="modes" role="tablist" aria-label="Working mode">
    <button role="tab" id="mode-guided" data-mode="guided" aria-selected="true">Guided Writing</button>
    <button role="tab" id="mode-template" data-mode="template" aria-selected="false">Essay Template</button>
    <button role="tab" id="mode-review" data-mode="review" aria-selected="false">Review My Essay</button>
  </div>
  <button class="btn primary" id="reviewAll" type="button">Review full essay</button>
</header>

<main class="shell">
  <aside class="brief" aria-label="Assignment and settings">
    <section class="group">
      <h2>Assignment</h2>
      <div class="field"><label for="topic">Essay topic</label><input type="text" id="topic"></div>
      <div class="field"><label for="prompt">Full task instructions</label><textarea id="prompt" rows="5"></textarea></div>
    </section>
    <section class="group">
      <h2>Settings</h2>
      <div class="field"><span class="lbl">Length</span>
        <div class="seg" id="length">
          <label><input type="radio" name="length" id="len-200" value="200-250"><span>200–250</span></label>
          <label><input type="radio" name="length" id="len-250" value="250-300"><span>250–300</span></label>
          <label><input type="radio" name="length" id="len-300" value="300-350"><span>300–350</span></label>
        </div></div>
      <div class="field"><span class="lbl">English level</span>
        <div class="seg" id="level">
          <label><input type="radio" name="level" id="lvl-b1" value="B1"><span>B1</span></label>
          <label><input type="radio" name="level" id="lvl-b2" value="B2"><span>B2</span></label>
          <label><input type="radio" name="level" id="lvl-c1" value="C1"><span>C1</span></label>
        </div></div>
      <div class="field"><label for="etype">Essay type</label><select id="etype"></select></div>
      <div class="field"><span class="lbl">Citation style</span>
        <div class="seg" id="citation">
          <label><input type="radio" name="citation" id="cit-apa" value="APA"><span>APA</span></label>
          <label><input type="radio" name="citation" id="cit-mla" value="MLA"><span>MLA</span></label>
          <label><input type="radio" name="citation" id="cit-none" value="none"><span>Informal</span></label>
        </div></div>
    </section>
    <section class="group">
      <h2>Source article</h2>
      <div class="file"><input type="file" id="srcFile" accept=".txt,.md,.pdf,.html,.htm,text/plain,application/pdf"></div>
      <div class="field"><label for="srcText">Or paste the article text</label><textarea id="srcText" rows="6" placeholder="Paste the abstract or the parts of the article you use."></textarea></div>
      <div class="row2">

      restate: "In conclusion, systems-thinking and strategic competences appear to be particularly significant for engineers working towards the SDGs.",
      summary: "Systems thinking helps engineers understand complex problems, while strategic competence helps them act together.",
      final: "Furthermore, universities should also teach anticipatory competence."
    }
  }
};

</script>
<script>
/* Essay Writing Assistant — rule-based checks and transparent rewrites (runs entirely in the browser) */
"use strict";

const AREAS = ["Word count", "Structure", "Thesis", "Essay type", "PEEL", "Examples & explanation", "Linking", "Academic style", "Vocabulary level", "Repetition", "Sentence length", "Grammar", "Relevance", "Citations"];

const countWords = t => (t || "").trim().split(/\s+/).filter(w => /[A-Za-z0-9]/.test(w)).length;
const sentencesOf = t => (t || "").replace(/\s+/g, " ").trim().split(/(?<=[.!?]["”’]?)\s+(?=["“‘]?[A-Z0-9])/).filter(s => s.trim());
const tokens = t => ((t || "").toLowerCase().match(/[a-z][a-z'’-]*/g) || []);
const stem = w => w.replace(/['’]s$/, "").replace(/(ies)$/, "y").replace(/(es|s)$/, "").slice(0, 7);
const content = t => tokens(t).filter(w => w.length > 3 && !STOP.has(w));
const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const clip = (s, n = 110) => s.length > n ? s.slice(0, n - 1).trimEnd() + "…" : s;
const cap = (src, rep) => /^[A-Z]/.test(src) && rep ? rep[0].toUpperCase() + rep.slice(1) : rep;
const norm = t => (t || "").toLowerCase().replace(/[“”"‘’']/g, "").replace(/[^a-z0-9 ]+/g, " ").replace(/\s+/g, " ").trim();

const LEVEL_SENTENCE = { B1: 25, B2: 30, C1: 35 };
const SYNONYMS = { important: "significant, crucial, essential", competence: "skill, capability, ability", engineers: "professionals, practitioners", help: "support, enable, contribute to", problem: "challenge, issue, difficulty", students: "learners, graduates", sustainable: "long-term, environmentally responsible", development: "progress, growth", people: "individuals, citizens", show: "indicate, demonstrate, reveal", need: "require, depend on", good: "beneficial, effective", think: "consider, argue, suggest" };

const EXPLAIN_RE = /\b(because|this (suggests|means|shows|indicates|demonstrates|implies)|therefore|as a result|which means|the significance|is (particularly )?(important|significant|crucial) (because|since)|so that|enables?|allows?|since|consequently|in other words)\b/i;
const EXAMPLE_RE = /\b(for example|for instance|such as|e\.g\.|illustrated|a relevant example|in the case of|a case in point|consider the|this can be seen in)\b/i;
const LINK_RE = /\b(therefore|thus|hence|consequently|this shows|this demonstrates|overall|as a result|clearly|for this reason|it follows)\b/i;
const EVIDENCE_RE = /\b(according to|research|study|studies|survey|found|findings|report(s|ed)?|data|evidence|results|emphasi[sz]es|argues|states)\b|\(\s*[A-Z][^()]*\d{4}\s*\)|\(\d{4}\)/;
const POSITION_RE = /\b(argues?|should|must|essential|important|significant|crucial|key|most|outweigh|better|more effective|believe|view|necessary|vital|particularly|primarily|largely|beneficial|harmful|agree|disagree)\b/i;
const NEWARG_RE = /\b(furthermore|moreover|another|in addition|for example|for instance|should also|a further)\b/i;

const APA_PAREN = /\(([A-Z][^()]*?),\s*(\d{4}[a-z]?|n\.d\.)(?:,\s*pp?\.\s*[\d–-]+)?\)/g;
const APA_NARR = /\b([A-Z][A-Za-zÀ-ÿ'’-]+(?:\s+(?:et al\.|and|&)(?:\s+[A-Z][A-Za-zÀ-ÿ'’-]+)?)?)\s+\((\d{4}[a-z]?)(?:,\s*pp?\.\s*[\d–-]+)?\)/g;
const MLA_PAREN = /\(([A-Z][A-Za-zÀ-ÿ'’-]+(?:\s+et al\.)?)\s+(\d+(?:[–-]\d+)?)\)/g;

function issue(sev, area, where, msg, extra) { return Object.assign({ sev, area, where, msg }, extra || {}); }

/* Assemble paragraphs from the structured editor or from pasted text. */
function buildParagraphs(model) {
  const { settings, mode, essay, reviewText } = model;
  const L = LENGTHS[settings.length];
  if (mode === "review") {
    let blocks = (reviewText || "").split(/\n\s*\n/).map(s => s.trim()).filter(Boolean);
    if (blocks.length < 3) blocks = (reviewText || "").split(/\n/).map(s => s.trim()).filter(Boolean);
    return blocks.map((text, i) => {
      const kind = i === 0 ? "intro" : (i === blocks.length - 1 && blocks.length > 1 ? "conclusion" : "body");
      const label = kind === "intro" ? "Introduction" : kind === "conclusion" ? "Conclusion" : "Body Paragraph " + i;
      return { id: kind === "body" ? "body" + i : kind, kind, label, text, parts: null };
    });
  }
  const ids = ["intro", "body1", "body2"];
  if (L.extra && Object.values(essay.body3 || {}).some(v => v.trim())) ids.push("body3");
  ids.push("conclusion");
  return ids.map(id => {
    const kind = id.startsWith("body") ? "body" : id;
    const partsDef = PARTS[kind];
    const parts = essay[id] || {};
    const text = partsDef.map(p => (parts[p.key] || "").trim()).filter(Boolean).join(" ");
    const label = kind === "intro" ? "Introduction" : kind === "conclusion" ? "Conclusion" : "Body Paragraph " + id.slice(4);
    return { id, kind, label, text, parts };
  });
}

function rangeFor(kind) { return RANGES[kind]; }

function analyse(model) {
  const { settings } = model;
  const L = LENGTHS[settings.length];
  const type = TYPES[settings.type];
  const paras = buildParagraphs(model);
  const full = paras.map(p => p.text).join("\n\n");
  const total = countWords(full);
  const out = [];
  const bodies = paras.filter(p => p.kind === "body");
  const filledBodies = bodies.filter(p => p.text);
  const intro = paras.find(p => p.kind === "intro");
  const concl = paras.find(p => p.kind === "conclusion");
  const structured = model.mode !== "review";
  const hasSource = (settings.srcText || "").trim().length > 80;

  paras.forEach(p => { p.words = countWords(p.text); p.range = rangeFor(p.kind); });

  if (!total) {
    out.push(issue("warn", "Structure", "Whole essay", structured ? "Start with the planning cards: choose your ideas and explain why they matter. Then build one body paragraph for each idea before writing the introduction." : "Paste your essay into the box. Leave a blank line between paragraphs."));
    return { paras, issues: out, total, full };
  }

  /* 1 — word count */
  if (total < L.min) out.push(issue(total < L.min * 0.85 ? "fix" : "warn", "Word count", "Whole essay", `Your essay has ${total} words. The task asks for ${L.min}–${L.max}, so add about ${L.min - total} more.` + (L.extra && filledBodies.length < 3 ? " At this length you may add a third body paragraph." : "")));
  else if (total > L.max) out.push(issue(total > L.max * 1.1 ? "fix" : "warn", "Word count", "Whole essay", `Your essay has ${total} words, ${total - L.max} over the ${L.max}-word limit. Cut repeated ideas or shorten long sentences.`));
  else out.push(issue("ok", "Word count", "Whole essay", `${total} words: within the ${L.min}–${L.max} target.`));
  paras.forEach(p => {
    if (!p.text) return;
    const [lo, hi] = p.range;
    if (p.words < lo) out.push(issue("warn", "Word count", p.label, `${p.label} has ${p.words} words; aim for ${lo}–${hi}.`, { para: p.id }));
    if (p.words > hi) out.push(issue("warn", "Word count", p.label, `${p.label} has ${p.words} words; aim for ${lo}–${hi}. Shorten or split an idea.`, { para: p.id }));
  });

  /* 2 — structure */
  if (!structured && paras.length < 4) out.push(issue("fix", "Structure", "Whole essay", `The checker found ${paras.length} paragraph${paras.length === 1 ? "" : "s"}. An essay needs an introduction, at least two body paragraphs and a conclusion, separated by blank lines.`));
  if (!intro || !intro.text) out.push(issue("fix", "Structure", "Introduction", "The introduction is missing.", { para: "intro" }));
  if (!concl || !concl.text) out.push(issue("fix", "Structure", "Conclusion", "The conclusion is missing. Restate your thesis and summarise your arguments in 35–50 words.", { para: "conclusion" }));
  if (filledBodies.length < 2) out.push(issue("fix", "Structure", "Body", `Only ${filledBodies.length} body paragraph${filledBodies.length === 1 ? " has" : "s have"} text. Develop at least two arguments.`));
  if (concl && concl.text) {
    const m = concl.text.match(NEWARG_RE);
    if (m) out.push(issue("fix", "Structure", "Conclusion", "The conclusion introduces a new argument. Move it to a body paragraph.", { quote: sentencesOf(concl.text).find(s => NEWARG_RE.test(s)), para: "conclusion", key: "final" }));
    if (citationsIn(concl.text).length) out.push(issue("fix", "Citations", "Conclusion", "The conclusion cites a source. Sources belong in the body paragraphs; the conclusion only summarises.", { para: "conclusion" }));
    const lastIntro = norm(intro && intro.text ? sentencesOf(intro.text).slice(-1)[0] : "");
    if (lastIntro.length > 25 && norm(concl.text).includes(lastIntro.slice(0, 60))) out.push(issue("warn", "Structure", "Conclusion", "The conclusion copies a sentence from the introduction. Paraphrase your thesis instead.", { para: "conclusion" }));
  }

  /* 3 — thesis */
  if (intro && intro.text) {
    let thesis = structured ? (intro.parts.thesis || "").trim() : "";
    if (!structured) thesis = sentencesOf(intro.text).find(s => /\b(this essay|argue|i believe|in my view|will (argue|discuss|examine))\b/i.test(s)) || sentencesOf(intro.text).slice(-1)[0] || "";
    const where = { para: "intro", key: "thesis" };
    if (!thesis) out.push(issue("fix", "Thesis", "Introduction", "Your introduction has no thesis statement. Add one sentence that states your position.", where));
    else {
      if (/\?\s*$/.test(thesis)) out.push(issue("fix", "Thesis", "Introduction", "Your thesis is a question. Turn it into a statement of your position.", Object.assign({ quote: thesis }, where)));
      else if (/\b(will|going to) (discuss|talk about|look at|describe|consider)\b/i.test(thesis) && !POSITION_RE.test(thesis)) out.push(issue("fix", "Thesis", "Introduction", "Your thesis statement announces the topic but does not clearly express your position.", Object.assign({ quote: thesis }, where)));
      else if (!POSITION_RE.test(thesis) || countWords(thesis) < 8) out.push(issue("fix", "Thesis", "Introduction", "Your thesis statement does not clearly express your position.", Object.assign({ quote: thesis }, where)));
      else out.push(issue("ok", "Thesis", "Introduction", "Your thesis states a clear position.", Object.assign({ quote: thesis }, where)));
      if (/\bI think\b/.test(thesis)) out.push(issue("warn", "Thesis", "Introduction", "Replace “I think” with “This essay argues that” to sound more academic.", Object.assign({ quote: thesis }, where)));
      if (settings.type === "competence") {
        const named = new Set((thesis.match(TYPES.competence.fit[1].count) || []).map(s => s.toLowerCase()));
        if (named.size < 2) out.push(issue("warn", "Thesis", "Introduction", "Name the two or three competences you will discuss in the thesis itself.", where));
      }
    }
  }

  /* 4 — essay type fit */
  const bodyText = bodies.map(p => p.text).join(" ");
  let fitOk = true;
  type.fit.forEach(f => {
    let pass = true;
    if (f.re) pass = f.re.test(full);
    if (f.cite) pass = citationsIn(bodyText).length > 0 || /\baccording to\b/i.test(bodyText);
    if (f.count) pass = new Set((full.match(f.count) || []).map(s => s.toLowerCase().replace(/[- ]/g, ""))).size >= f.min;
    if (!pass) { fitOk = false; out.push(issue("fix", "Essay type", "Whole essay", f.msg)); }
  });
  if (fitOk) out.push(issue("ok", "Essay type", "Whole essay", `The essay shows the signals of a ${type.name}.`));

  /* 5 — PEEL and examples/explanations */
  bodies.forEach(p => {
    if (!p.text) return;
    const w = p.label;
    if (structured) {
      const s = k => (p.parts[k] || "").trim();
      const at = k => ({ para: p.id, key: k });
      if (!s("point")) out.push(issue("fix", "PEEL", w, "There is no Point. Start the paragraph with one sentence that states its main idea.", at("point")));
      if (!s("evidence")) out.push(issue(["source", "competence"].includes(settings.type) ? "fix" : "warn", "PEEL", w, "There is no Evidence. Add information from your source that supports the point.", at("evidence")));
      if (!s("explanation")) out.push(issue("fix", "Examples & explanation", w, s("evidence") ? "This paragraph contains evidence, but you need to explain why it supports your argument." : "Add an Explanation: say why your point matters.", at("explanation")));
      else if (!EXPLAIN_RE.test(s("explanation"))) out.push(issue("warn", "Examples & explanation", w, "Your explanation restates information but does not say why it matters. Try “This suggests that…” or “This is particularly important because…”.", Object.assign({ quote: s("explanation") }, at("explanation"))));
      if (!s("example")) out.push(issue("warn", "Examples & explanation", w, "There is no concrete example. Add a real situation, project or profession that illustrates the point.", at("example")));
      if (!s("link")) out.push(issue("warn", "PEEL", w, "There is no Link sentence. Connect the paragraph back to your thesis.", at("link")));
      else if (intro && intro.parts && overlap(s("link"), intro.parts.thesis || "") === 0) out.push(issue("warn", "PEEL", w, "The Link does not echo any key words from your thesis, so the connection is weak.", Object.assign({ quote: s("link") }, at("link"))));
      if (s("point") && s("link") && norm(s("point")) === norm(s("link"))) out.push(issue("warn", "PEEL", w, "The Link repeats the Point word for word. Show what the paragraph has proved instead.", at("link")));
      if (s("evidence") && s("explanation") && s("example") && s("link") && s("point")) out.push(issue("ok", "PEEL", w, "All five PEEL parts are present.", { para: p.id }));
    } else {
      const ss = sentencesOf(p.text);
      const at = { para: p.id };
      const missing = [];
      if (!ss.slice(1).some(x => EVIDENCE_RE.test(x)) && !EVIDENCE_RE.test(ss[0] || "")) missing.push("Evidence");
      if (!EXPLAIN_RE.test(p.text)) missing.push("Explanation");
      if (!EXAMPLE_RE.test(p.text)) out.push(issue("warn", "Examples & explanation", w, "No concrete example was found. Signal one with “For instance,” or “This is illustrated by…”.", at));
      if (!LINK_RE.test(ss.slice(-1)[0] || "")) missing.push("Link");
      if (ss.length < 4) out.push(issue("warn", "PEEL", w, `This paragraph has ${ss.length} sentence${ss.length === 1 ? "" : "s"}. A PEEL paragraph usually needs 4–6.`, at));
      if (missing.includes("Explanation") && !missing.includes("Evidence")) out.push(issue("fix", "Examples & explanation", w, "This paragraph contains evidence, but you need to explain why it supports your argument.", at));
      else if (missing.includes("Explanation")) out.push(issue("warn", "Examples & explanation", w, "No explanation signal was found. Add a sentence such as “This suggests that…”.", at));
      if (missing.includes("Evidence")) out.push(issue("warn", "PEEL", w, "No evidence was found. Refer to your source or to data that supports the point.", at));
      if (missing.includes("Link")) out.push(issue("warn", "PEEL", w, "The last sentence does not link back to the thesis. Try “Therefore, … is essential for …”.", Object.assign({ quote: ss.slice(-1)[0] }, at)));
      if (!missing.length) out.push(issue("ok", "PEEL", w, "Point, evidence, explanation and link signals are all present.", at));
    }
  });

  /* 6 — linking expressions */
  const lowFull = full.toLowerCase();
  const used = LINKERS.filter(l => new RegExp("\\b" + esc(l) + "\\b").test(lowFull));
  bodies.forEach(p => {
    if (!p.text) return;
    const n = LINKERS.filter(l => new RegExp("\\b" + esc(l) + "\\b", "i").test(p.text)).length;
    if (n === 0) out.push(issue("warn", "Linking", p.label, "This paragraph uses no linking expressions. Guide the reader with “Moreover,” “This suggests that…” or “Therefore,”.", { para: p.id }));
  });
  LINKERS.forEach(l => { const c = (lowFull.match(new RegExp("\\b" + esc(l) + "\\b", "g")) || []).length; if (c >= 3 && !["because", "while", "such as"].includes(l)) out.push(issue("warn", "Linking", "Whole essay", `“${l}” appears ${c} times. Vary your linking expressions.`)); });
  if (used.length >= 5) out.push(issue("ok", "Linking", "Whole essay", `Good range of linking expressions (${used.length}): ${used.slice(0, 5).join(", ")}…`));

  /* 7 — academic style */
  paras.forEach(p => {
    if (!p.text) return;
    const seen = new Set();
    UPGRADE.forEach(([re, rep, why]) => {
      if (/important\\b/.test(re.source) && !/very|really/.test(re.source)) return;
      re.lastIndex = 0;
      const m = p.text.match(new RegExp(re.source, re.flags.replace("g", "")));
      if (m && !seen.has(m[0].toLowerCase())) {
        seen.add(m[0].toLowerCase());
        const to = m[0].replace(new RegExp(re.source, re.flags.replace("g", "")), rep).trim();
        out.push(issue("warn", "Academic style", p.label, to ? `Replace “${m[0].trim()}” with “${to}”. ${why}` : `Remove “${m[0].trim()}”. ${why}`, { para: p.id, quote: sentencesOf(p.text).find(s => s.includes(m[0])) }));
      }
    });
    if (/!/.test(p.text)) out.push(issue("warn", "Academic style", p.label, "Avoid exclamation marks in academic writing.", { para: p.id }));
    if (p.kind === "body" && /\?/.test(p.text)) out.push(issue("warn", "Academic style", p.label, "Rhetorical questions weaken a body paragraph. State the idea directly.", { para: p.id }));
    if (/\byou(r)?\b/i.test(p.text)) out.push(issue("warn", "Academic style", p.label, "Avoid addressing the reader as “you”. Use “students”, “engineers” or “people” instead.", { para: p.id, quote: sentencesOf(p.text).find(s => /\byou(r)?\b/i.test(s)) }));
  });

  /* 8 — vocabulary level */
  const cw = content(full);
  const acad = cw.filter(w => ACADEMIC.has(w) || ACADEMIC.has(w.replace(/(s|es|ed|ing|ly)$/, ""))).length;
  const ratio = cw.length ? acad / cw.length : 0;
  const ttr = cw.length ? new Set(cw.map(stem)).size / cw.length : 0;
  const est = ratio >= 0.14 && ttr >= 0.55 ? "C1" : ratio >= 0.08 ? "B2" : "B1";
  const order = { B1: 1, B2: 2, C1: 3 };
  const lvlMsg = `Estimated vocabulary level: ${est} (${Math.round(ratio * 100)}% academic words, ${Math.round(ttr * 100)}% word variety).`;
  if (order[est] < order[settings.level]) out.push(issue("warn", "Vocabulary level", "Whole essay", `${lvlMsg} Your target is ${settings.level}. Use “Upgrade to C1” on a paragraph to see precise replacements.`));
  else out.push(issue("ok", "Vocabulary level", "Whole essay", `${lvlMsg} This matches your ${settings.level} target.`));
  if (settings.level === "B1" && est === "C1") out.push(issue("warn", "Vocabulary level", "Whole essay", "Your vocabulary is more advanced than B1. Make sure every word is one you can use accurately."));

  /* 9 — repetition */
  const topicStems = new Set(content(settings.topic + " " + settings.required).map(stem));
  const freq = {};
  cw.forEach(w => { const s = stem(w); (freq[s] = freq[s] || { n: 0, word: w }).n++; });
  Object.entries(freq).filter(([s, v]) => v.n >= (topicStems.has(s) ? 7 : 4)).sort((a, b) => b[1].n - a[1].n).slice(0, 5)
    .forEach(([s, v]) => out.push(issue("warn", "Repetition", "Whole essay", `“${v.word}” appears ${v.n} times.` + (SYNONYMS[v.word] || SYNONYMS[s] ? ` Try: ${SYNONYMS[v.word] || SYNONYMS[s]}.` : " Use a synonym or a pronoun in some places.")))) ;

  /* 10 — sentence length */
  const limit = LEVEL_SENTENCE[settings.level];
  paras.forEach(p => sentencesOf(p.text).forEach(s => {
    const n = countWords(s);
    if (n > limit) out.push(issue(n > limit + 10 ? "fix" : "warn", "Sentence length", p.label, `This sentence has ${n} words (limit for ${settings.level}: about ${limit}). Split it into two, or use “Simplify”.`, { para: p.id, quote: clip(s) }));
  }));

  /* 11 — grammar patterns */
  paras.forEach(p => grammarIn(p.text).forEach(g => out.push(issue(g.sev || "fix", "Grammar", p.label, g.msg, { para: p.id, quote: g.quote }))));

  /* 13 — relevance */
  const topicWords = new Set(content(settings.topic).map(stem));
  if (topicWords.size) bodies.forEach(p => {
    if (!p.text) return;
    if (!content(p.text).some(w => topicWords.has(stem(w)))) out.push(issue("warn", "Relevance", p.label, `This paragraph never mentions the key terms of your topic (${[...new Set(content(settings.topic))].slice(0, 4).join(", ")}). Check that the argument answers the task.`, { para: p.id }));
  });
  (settings.required || "").split("\n").map(s => s.trim()).filter(Boolean).forEach(req => {
    const keys = content(req).map(stem);
    const words = new Set(cw.map(stem));
    const found = keys.length ? keys.every(k => words.has(k)) : lowFull.includes(req.toLowerCase());
    out.push(found ? issue("ok", "Relevance", "Required content", `Required idea included: “${req}”.`) : issue("fix", "Relevance", "Required content", `Required idea not found: “${req}”. Add it to a body paragraph.`));
  });

  /* 14 — citations */
  citationChecks(paras, settings, hasSource, structured).forEach(i => out.push(i));

  return { paras, issues: out, total, full, level: est };
}

function overlap(a, b) { const B = new Set(content(b).map(stem)); return content(a).filter(w => B.has(stem(w))).length; }

function citationsIn(text) {
  const found = [];
  let m;
  for (const re of [APA_PAREN, APA_NARR, MLA_PAREN]) {
    re.lastIndex = 0;
    while ((m = re.exec(text))) found.push({ raw: m[0], name: m[1], yearOrPage: m[2], kind: re === MLA_PAREN ? "MLA" : "APA", index: m.index });
  }
  return found;
}

function grammarIn(text) {
  const res = [];
  const add = (re, msg, sev) => { const m = text.match(re); if (m) res.push({ msg: typeof msg === "function" ? msg(m) : msg, quote: sentencesOf(text).find(s => s.includes(m[0])) || m[0], sev }); };
  add(/\b(\w+)\s+\1\b/i, m => `The word “${m[1]}” is repeated by mistake.`);
  add(/\ba\s+(?!uni|use|usu|eu|one|once|u\.)[aeiouAEIOU]\w*/, m => `Use “an” before a vowel sound: “${m[0].replace(/^a/, "an")}”.`);
  add(/\ban\s+(?!hour|honest|honou?r|heir|SDG|MBA|NGO|FAQ|LLM)[b-df-hj-np-tv-zB-DF-HJ-NP-TV-Z]\w*/, m => `Use “a” before a consonant sound: “${m[0].replace(/^an/, "a")}”.`);
  add(/\b(informations|advices|knowledges|equipments|evidences|feedbacks|researches show)\b/i, m => `“${m[1].split(" ")[0]}” is uncountable in English. Remove the “-s”.`);
  add(/\bpeoples\b/i, "Use “people” (plural already), not “peoples”, unless you mean nations.");
  add(/\b(more|most) (better|easier|bigger|best|worse|harder|faster)\b/i, m => `“${m[0]}” is a double comparative. Use “${m[2]}” alone.`);
  add(/\b(people|students|engineers|children|they|we) (is|was|has)\b/i, m => `Subject–verb agreement: “${m[1]}” needs a plural verb (${({ is: "are", was: "were", has: "have" })[m[2].toLowerCase()]}).`);
  add(/\b(he|she|it|everyone|everybody|this competence|the student) (have|are|were|do)\b/i, m => `Subject–verb agreement: “${m[1]}” needs a singular verb.`);
  add(/\bthere (is|was) (many|several|a lot of|numerous)\b/i, m => `Use “there ${m[1] === "is" ? "are" : "were"}” before a plural noun.`);
  add(/\b(depend|depends|depended) of\b/i, "The correct preposition is “depend on”.");
  add(/\b(discuss|discusses|discussed) about\b/i, "“Discuss” takes no preposition: “discuss the issue”.");
  add(/\b(emphasi[sz]e|emphasi[sz]es) on\b/i, "“Emphasise” takes no preposition. Use “emphasise X” or “place emphasis on X”.");
  add(/\bin the other hand\b/i, "The fixed phrase is “on the other hand”.");
  add(/\baccording to me\b/i, "“According to me” is not used in English. Write “In my view,” or use an impersonal phrase.");
  add(/\b(can|must|should|could|might|will|would) to \w+/i, m => `Modal verbs take the bare infinitive: “${m[0].replace(" to ", " ")}”.`);
  add(/\b(consist|consists) from\b/i, "The correct preposition is “consist of”.");
  add(/(^|(?!al|etc|vs)[A-Za-z]{2,}[.!?]\s+)[a-z]\w*/, "A sentence starts with a lowercase letter.", "warn");
  add(/\bi\b(?!\.e\.)/, "Write the pronoun “I” with a capital letter.");
  add(/[,;:](?=[A-Za-z])/, "Add a space after the punctuation mark.", "warn");
  add(/\s[,.;:](?!\d)/, "Remove the space before the punctuation mark.", "warn");
  add(/ {2,}/, "There is a double space.", "warn");
  return res;
}

function citationChecks(paras, settings, hasSource, structured) {
  const out = [];
  const style = settings.citation;
  const author = (settings.srcAuthor || "").trim();
  const year = (settings.srcYear || "").trim();
  const firstSurname = (author.match(/[A-ZÀ-Ý][A-Za-zÀ-ÿ'’-]+/) || [""])[0];
  const srcNorm = norm(settings.srcText);
  const srcStems = new Set(content(settings.srcText).map(stem));
  let any = 0;

  paras.filter(p => p.kind === "body" && p.text).forEach(p => {
    const cites = citationsIn(p.text);
    any += cites.length;
    cites.forEach(c => {
      if (style === "APA" && c.kind === "MLA") out.push(issue("fix", "Citations", p.label, `“${c.raw}” is MLA format. APA uses author and year: (${firstSurname || "Author"}${/et al/.test(author) ? " et al." : ""}, ${year || "Year"}).`, { para: p.id }));
      if (style === "MLA" && c.kind === "APA") out.push(issue("fix", "Citations", p.label, `“${c.raw}” is APA format. MLA uses author and page: (${firstSurname || "Author"}${/et al/.test(author) ? " et al." : ""} 4).`, { para: p.id }));
      if (firstSurname && !c.name.includes(firstSurname)) out.push(issue("warn", "Citations", p.label, `You cite “${c.raw}”, but your source is ${author} (${year}). Check the author's name.`, { para: p.id }));
      if (c.kind === "APA" && year && /^\d{4}/.test(c.yearOrPage) && c.yearOrPage.slice(0, 4) !== year) out.push(issue("fix", "Citations", p.label, `The year in “${c.raw}” does not match your source (${year}).`, { para: p.id }));
      if (/et al/.test(author) && firstSurname && c.name.includes(firstSurname) && !/et al\./.test(c.name)) out.push(issue("warn", "Citations", p.label, `This source has three or more authors, so write “${firstSurname} et al.”.`, { para: p.id }));
      if (/et al(?!\.)/.test(c.raw)) out.push(issue("warn", "Citations", p.label, "“et al.” always has a full stop.", { para: p.id }));
    });

    /* quotations */
    const quotes = [...p.text.matchAll(/["“]([^"”]{12,})["”]/g)].map(m => m[1]);
    quotes.forEach(q => {
      if (!hasSource) out.push(issue("warn", "Citations", p.label, "No article is loaded, so this quotation cannot be checked. Add the article text to verify it.", { para: p.id, quote: q }));
      else if (!srcNorm.includes(norm(q))) out.push(issue("fix", "Citations", p.label, "This quotation was not found in the source text you added. Quote the article word for word, or paraphrase it without quotation marks.", { para: p.id, quote: q }));
      if (style === "APA" && !/pp?\.\s*\d/.test(p.text)) out.push(issue("warn", "Citations", p.label, `APA direct quotations need a page number, e.g. (${firstSurname || "Author"}${/et al/.test(author) ? " et al." : ""}, ${year || "Year"}, p. 4).`, { para: p.id }));
    });

    /* cited sentences whose content is not in the source */
    if (hasSource) sentencesOf(p.text).filter(s => citationsIn(s).length || /\baccording to\b/i.test(s)).forEach(s => {
      if (/["“]/.test(s)) return;
      const cws = content(s.replace(APA_PAREN, "").replace(APA_NARR, "")).filter(w => !/^(according|state|states|stated|emphasi|argue|report)/.test(w));
      if (cws.length < 4) return;
      const hit = cws.filter(w => srcStems.has(stem(w))).length / cws.length;
      if (hit < 0.35) out.push(issue("warn", "Citations", p.label, "This sentence cites the article, but most of its content does not appear in the source text you added. Check that the article really says this.", { para: p.id, quote: clip(s) }));
      else out.push(issue("ok", "Citations", p.label, "This cited claim matches words in your source text.", { para: p.id, quote: clip(s, 80) }));
    });

    if (structured && style !== "none") {
      const ev = (p.parts.evidence || "").trim();
      if (ev && !citationsIn(ev).length) out.push(issue("warn", "Citations", p.label, `The Evidence sentence has no citation. Add ${style === "APA" ? `“${firstSurname || "Author"}${/et al/.test(author) ? " et al." : ""} (${year || "Year"})”` : "the author and page"}.`, { para: p.id, key: "evidence" }));
    }
  });

  if (!hasSource) out.unshift(issue("warn", "Citations", "Source", "No article is loaded. The assistant cannot check whether your references or claims match the source. Upload the article or paste its text on the left."));
  if (hasSource && !any && style !== "none" && ["source", "competence"].includes(settings.type)) out.push(issue("fix", "Citations", "Whole essay", `You loaded a source but never cite it. Refer to it in a body paragraph, e.g. “According to ${author || "Author"} (${year || "Year"}), …”.`));
  return out;
}

/* ---------- transparent rewrites ---------- */
function applyRules(text, rules) {
  const changes = [];
  let t = text;
  rules.forEach(([re, rep, why]) => {
    re.lastIndex = 0;
    t = t.replace(re, (...args) => {
      const m = args[0];
      let to = typeof rep === "function" ? rep(m) : m.replace(new RegExp(re.source, re.flags.replace("g", "")), rep);
      to = cap(m, to);
      if (to !== m) changes.push({ from: m.trim(), to: to.trim(), why });
      return to;
    });
  });
  return { text: t.replace(/ {2,}/g, " "), changes };
}

function splitLong(text, limit) {
  const changes = [];
  const parts = sentencesOf(text).map(s => {
    if (countWords(s) <= limit) return s;
    const cuts = [/;\s+/, /,\s+which\s+/, /,\s+and\s+(?=\w+\s+\w+)/, /,\s+but\s+/, /\s+and they\s+/, /\s+because\s+/];
    for (const c of cuts) {
      const m = s.match(c);
      if (!m) continue;
      const i = m.index;
      const left = s.slice(0, i).replace(/[,;]$/, "") + ".";
      let joiner = { ";": "", which: "This ", and: "", but: "However, ", they: "They ", because: "This is because " };
      const key = /which/.test(m[0]) ? "which" : /but/.test(m[0]) ? "but" : /they/.test(m[0]) ? "they" : /because/.test(m[0]) ? "because" : /;/.test(m[0]) ? ";" : "and";
      let right = s.slice(i + m[0].length);
      right = joiner[key] ? joiner[key] + right : right.charAt(0).toUpperCase() + right.slice(1);
      if (countWords(left) < 6 || countWords(right) < 6) continue;
      changes.push({ from: clip(s, 70), to: clip(left, 40) + " / " + clip(right, 40), why: `Split a ${countWords(s)}-word sentence into two shorter ones so each carries one idea.` });
      return left + " " + right;
    }
    return s;
  });
  return { text: parts.join(" "), changes };
}

function simplifyText(text, level) {
  const a = applyRules(text, SIMPLIFY);
  const b = splitLong(a.text, Math.min(LEVEL_SENTENCE[level], 25));
  return { text: b.text, changes: a.changes.concat(b.changes) };
}
function upgradeText(text) {
  const a = applyRules(text, UPGRADE);
  const b = splitLong(a.text, LEVEL_SENTENCE.C1);
  return { text: b.text, changes: a.changes.concat(b.changes) };
}

/* Find sentences in the source that share key words with a point — real extracts, never invented. */
function sourceMatches(srcText, query, n = 3) {
  const q = new Set(content(query).map(stem));
  if (!q.size) return [];
  return sentencesOf(srcText).map(s => ({ s, score: content(s).filter(w => q.has(stem(w))).length }))
    .filter(x => x.score > 0).sort((a, b) => b.score - a.score).slice(0, n).map(x => x.s);
}

<script>
/* Essay Writing Assistant — state, assignment panel and essay editor */
"use strict";

const $ = (s, r = document) => r.querySelector(s);

  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || (v === false && !k.startsWith("aria-"))) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "text") el.textContent = v;
    else el.setAttribute(k, v === true && !k.startsWith("aria-") ? "" : String(v));

};

const saved = load();

/* ---------- toast ---------- */
let toastTimer;

/* ---------- assignment panel ---------- */

}

async function readSource(file) {
  const name = file.name.toLowerCase();
  try {
    let text;
    if (name.endsWith(".pdf")) {
      toast("Reading PDF…");
      text = await readPdf(file);
    } else {
      text = await file.text();
      if (/\.html?$/.test(name)) { const d = new DOMParser().parseFromString(text, "text/html"); text = d.body.textContent; }
    }
    text = text.replace(/[ \t]+/g, " ").replace(/\n{3,}/g, "\n\n").trim();
    if (!text) throw new Error("empty");
    S.settings.srcText = text;
    $("#srcText").value = text;
    if (!S.settings.srcTitle) { S.settings.srcTitle = file.name.replace(/\.[^.]+$/, ""); $("#srcTitle").value = S.settings.srcTitle; }
    renderSourceStatus(); changed();
    toast(`Loaded ${countWords(text)} words from ${file.name}. Add the author and year.`);
  } catch (e) {
    toast(name.endsWith(".pdf") ? "This PDF has no readable text. Copy the text from the article and paste it instead." : "The file could not be read. Paste the article text instead.");
  }
}

function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = rej; document.head.append(s); });
}
async function readPdf(file) {
  const base = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  if (!window.pdfjsLib) await loadScript(base + "pdf.min.js");
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = base + "pdf.worker.min.js";
  const doc = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const pages = [];
  for (let i = 1; i <= Math.min(doc.numPages, 40); i++) {
    const c = await (await doc.getPage(i)).getTextContent();
    pages.push(c.items.map(it => it.str + (it.hasEOL ? "\n" : " ")).join(""));
  }
  return pages.join("\n\n").replace(/-\n(?=[a-z])/g, "");
}

/* ---------- essay editor ---------- */

const stageOf = a => (STAGES.find(st => st.parts.some(([s, k]) => s === a.sec && k === a.key)) || STAGES[0]).id;

function joinedIdeas(items) {

function fieldGuide(sec, key) {
  const chosen = (S.plan && S.plan.chosen) || [];

    body: {

        [`${idea[0].toUpperCase() + idea.slice(1)} is particularly important because …`, `${idea} особенно важна, потому что …`, "Самый ясный вариант для начала абзаца."],
        [`One of the most significant competences is ${idea}, as it enables …`, `Одной из наиболее значимых компетенций является ${idea}, поскольку она позволяет …`, "Используй, если хочешь сразу показать результат этой компетенции."],

function partRow(sec, p) {
  const id = `f-${sec}-${p.key}`;
  let q = p.key === "thesis" ? TYPES[S.settings.type].position : p.q;
  if (S.settings.type === "competence" && sec.startsWith("body")) {
    const picked = S.plan && S.plan.chosen[Number(sec.slice(4)) - 1];
    if (picked && p.key === "point") q = `State that ${picked} is important and give your main reason. Do not explain everything yet.`;
    if (picked && p.key === "explanation") q = `In your own reasoning, why does ${picked} help achieve the SDGs?`;
  }
  const ta = h("textarea", { id, rows: 1, placeholder: S.mode === "template" ? p.label + "…" : p.hint });

    h("div", { class: "part-top" }, h("label", { for: id }, p.label), h("span", { class: "q" }, q)),

      h("span", { class: "eyebrow" }, "How to start this part"),

      h("div", { class: "start-options" }, guide.options.map((o, i) => h("div", { class: "start-option" },
        h("span", { class: "option-rank" }, i === 0 ? "Лучший вариант" : `Вариант ${i + 1}`),
        h("button", { type: "button", class: "recommended", onclick: () => insertPhrase(o[0], ta) }, o[0]),
        h("span", { class: "translation" }, o[1]),

function markActive() {

}

function autosize(ta) { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; }

function fillCitation(s) {
  const a = S.settings.srcAuthor || "[Author]", y = S.settings.srcYear || "[Year]";
  return s.replace(/\[Author\]/g, a).replace(/\[Year\]/g, y);
}
function insertPhrase(phrase, ta) {
  ta = ta || document.getElementById(`f-${S.active.sec}-${S.active.key}`) || $("#reviewText");
  if (!ta) return;
  let p = fillCitation(phrase).replace(/\s*…\s*/g, " … ").trim();
  const start = ta.selectionStart ?? ta.value.length, end = ta.selectionEnd ?? ta.value.length;
  const before = ta.value.slice(0, start), after = ta.value.slice(end);
  const pad = before && !/\s$/.test(before) ? " " : "";
  const tail = /[,.]$/.test(p) || /that$|because$|by$|to$|in$|of$|is$|as$/.test(p) ? " " : " ";
  ta.value = before + pad + p + tail + after.replace(/^\s+/, "");
  const caret = (before + pad + p + tail).length;
  ta.focus(); ta.setSelectionRange(caret, caret);
  ta.dispatchEvent(new Event("input"));

}

function reviewBox() {

  ta.value = S.reviewText;

function paragraphPicker() {
  const sel = h("select", { id: "reviewPara", style: "width:auto;flex:1 1 160px" });

  const cur = () => sel.value || "intro";
  return [sel,
    h("button", { type: "button", class: "btn", onclick: () => suggestVocab(cur()) }, "Suggest vocabulary"),
    h("button", { type: "button", class: "btn", onclick: () => checkParagraph(cur()) }, "Check paragraph"),
    h("button", { type: "button", class: "btn", onclick: () => propose(cur(), "simplify") }, "Simplify"),
    h("button", { type: "button", class: "btn", onclick: () => propose(cur(), "upgrade") }, "Upgrade to C1")];
}

/* ---------- shared refresh ---------- */
const model = () => ({ settings: S.settings, mode: S.mode, essay: S.essay, reviewText: S.reviewText });
let refreshTimer;
function changed() {
  save();
  S.result = analyse(model());
  renderMeters();
  clearTimeout(refreshTimer);
  refreshTimer = setTimeout(() => { if (S.mode === "guided") { const f = document.activeElement; renderStages(); if (f && f.tagName === "TEXTAREA") f.focus({ preventScroll: true }); } renderPanel(); }, 450);
}

function setMeter(el, words, lo, hi, scaleMax) {
  if (!el) return;
  el.style.setProperty("--pct", Math.min(100, words / scaleMax * 100));
  el.style.setProperty("--lo", lo / scaleMax * 100);
  el.style.setProperty("--hi", hi / scaleMax * 100);
  const state = words === 0 ? "" : words < lo ? "under" : words > hi ? "over" : "in";
  el.className = "meter " + state;
  return state;
}

function init() {
  bindBrief();
  $$(".modes button").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.mode === "review" && S.mode !== "review" && !S.reviewText.trim()) S.reviewText = essayToText(S.essay, L().extra);
    S.mode = b.dataset.mode; S.scope = null; S.proposal = null; renderDesk(); changed();
  }));
  $$(".tabs button").forEach(b => b.addEventListener("click", () => { S.tab = b.dataset.tab; renderPanel(); }));
  $("#reviewAll").addEventListener("click", reviewAll);
  $("#clearExample").addEventListener("click", () => {
    Object.assign(S.settings, { topic: "", prompt: "", srcText: "", srcAuthor: "", srcYear: "", srcTitle: "", required: "" });
    ["topic", "prompt", "srcText", "srcAuthor", "srcYear", "srcTitle", "required"].forEach(id => { $("#" + id).value = ""; });
    S.essay = blankEssay(); S.reviewText = ""; S.isExample = false; S.plan = { chosen: [], reasons: {}, examples: {} }; S.proposal = null; S.tutor = null; S.scope = null;
    S.active = { sec: "intro", key: "thesis" };
    renderSourceStatus(); renderDesk(); changed();
    $("#topic").focus();
    toast("Example cleared. Start with your topic on the left.");
  });
  renderDesk();
  changed();
  renderPanel();
}
