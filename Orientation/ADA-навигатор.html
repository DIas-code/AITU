<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Навигатор ADA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,300..600&display=swap">

<style>
:root{
  --bg:#F1F5F6; --surface:#FFFFFF; --surface2:#E8EFF1; --sunk:#DCE5E8;
  --ink:#0F1F28; --ink2:#3C525D; --muted:#6B818C;
  --line:#D3DDE0; --line2:#B2C2C8;
  --accent:#0C6672; --accent-ink:#08505A; --accent-soft:#DDEDEF;
  --gold:#8E6708; --gold-soft:#F6EBD2;
  --bd:#0C6672; --pd:#3A4A83; --nir:#4A6B3C; --ia:#8E6708;
  --ok:#2C6B4E; --warn:#9C5418;
  --shadow:0 1px 2px rgba(15,31,40,.05), 0 8px 24px -16px rgba(15,31,40,.28);
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1316; --surface:#121C20; --surface2:#18252A; --sunk:#0E181B;
    --ink:#E5ECEF; --ink2:#AFC0C7; --muted:#7E939C;
    --line:#233238; --line2:#33474E;
    --accent:#4FB0BD; --accent-ink:#7FCBD5; --accent-soft:#103137;
    --gold:#D6AB59; --gold-soft:#2E2510;
    --bd:#4FB0BD; --pd:#8B96DC; --nir:#8FB878; --ia:#D6AB59;
    --ok:#6DBE94; --warn:#DA9459;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#0B1316; --surface:#121C20; --surface2:#18252A; --sunk:#0E181B;
  --ink:#E5ECEF; --ink2:#AFC0C7; --muted:#7E939C;
  --line:#233238; --line2:#33474E;
  --accent:#4FB0BD; --accent-ink:#7FCBD5; --accent-soft:#103137;
  --gold:#D6AB59; --gold-soft:#2E2510;
  --bd:#4FB0BD; --pd:#8B96DC; --nir:#8FB878; --ia:#D6AB59;
  --ok:#6DBE94; --warn:#DA9459;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -16px rgba(0,0,0,.8);
}

*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Archivo","Segoe UI",system-ui,sans-serif;
  font-size:15px; line-height:1.5; margin:0;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1120px; margin:0 auto; padding:0 22px}
h1,h2,h3,h4{margin:0; text-wrap:balance; font-weight:600; letter-spacing:-.015em}
p{margin:0}
a{color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
.prose{font-family:"Newsreader",Georgia,serif; font-size:16.5px; line-height:1.55; color:var(--ink2); max-width:72ch}

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:60; background:var(--surface);
  border-bottom:1px solid var(--line);
}
.topbar-in{display:flex; align-items:center; gap:18px; height:58px}
.brand{display:flex; align-items:baseline; gap:9px; margin-right:auto; min-width:0}
.brand b{font-size:16px; font-weight:700; letter-spacing:-.02em; font-stretch:112%}
.brand span{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); white-space:nowrap}
.nav{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{
  font-size:13px; color:var(--ink2); text-decoration:none; padding:6px 11px;
  border-radius:99px; white-space:nowrap; transition:background .15s,color .15s;
}
.nav a:hover{background:var(--surface2); color:var(--ink)}
.ctrls{display:flex; gap:6px; flex-shrink:0}
.btn{
  font:inherit; font-size:12px; font-weight:600; letter-spacing:.02em;
  background:var(--surface2); color:var(--ink2); border:1px solid var(--line);
  border-radius:99px; padding:6px 12px; cursor:pointer; transition:.15s;
}
.btn:hover{border-color:var(--line2); color:var(--ink)}
.seg{display:flex; border:1px solid var(--line); border-radius:99px; overflow:hidden; background:var(--surface2)}
.seg button{
  font:inherit; font-size:12px; font-weight:600; letter-spacing:.04em;
  background:none; border:0; color:var(--muted); padding:6px 11px; cursor:pointer;
}
@media(max-width:900px){.brand span{display:none}}
@media(max-width:760px){
  .topbar-in{height:auto; flex-wrap:wrap; gap:0 12px; padding:9px 0 0}
  .brand{order:1}
  .ctrls{order:2}
  .nav{order:3; width:100%; margin:8px -22px 0; padding:0 22px 7px}
}
.seg button[aria-pressed="true"]{background:var(--accent); color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#08181B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#08181B}}

/* ---------- sections ---------- */
section{padding:52px 0 8px; scroll-margin-top:70px}
.sec-head{display:flex; align-items:flex-end; gap:14px; margin-bottom:20px; flex-wrap:wrap}
.eyebrow{
  font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--muted);
}
.sec-head h2{font-size:26px; font-stretch:108%; line-height:1.15}
.sec-head .note{font-size:13px; color:var(--muted); margin-left:auto}
.rule{height:1px; background:var(--line); margin:0}

.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.grid{display:grid; gap:14px}

/* ---------- now panel ---------- */
.now{
  display:grid; grid-template-columns:minmax(0,1.15fr) minmax(0,1fr); gap:0;
  overflow:hidden; margin-top:34px;
}
.now-main{padding:26px 26px 24px; border-right:1px solid var(--line)}
.now-side{padding:22px 24px; background:var(--surface2)}
.now-date{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
.now-phase{font-size:29px; font-stretch:110%; font-weight:700; line-height:1.1; margin:10px 0 8px}
.now-sub{font-size:14px; color:var(--ink2)}
.now-bar{margin-top:20px}
.track{height:7px; border-radius:99px; background:var(--sunk); overflow:hidden; border:1px solid var(--line)}
.track i{display:block; height:100%; background:var(--accent); border-radius:99px}
.track-lab{display:flex; justify-content:space-between; margin-top:7px; font-size:11.5px; color:var(--muted)}
.up-h{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); margin-bottom:12px}
.up{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:11px}
.up li{display:flex; gap:11px; align-items:baseline; font-size:13.5px}
.up .d{font-size:12px; color:var(--accent-ink); min-width:82px; flex-shrink:0}
.up .n{color:var(--ink2)}
.up .in{margin-left:auto; font-size:11.5px; color:var(--muted); white-space:nowrap; padding-left:8px}
@media(max-width:760px){.now{grid-template-columns:1fr}.now-main{border-right:0; border-bottom:1px solid var(--line)}}

/* ---------- stats ---------- */
.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:14px}
.stat{padding:16px 18px}
.stat .v{font-size:30px; font-weight:700; font-stretch:105%; line-height:1; letter-spacing:-.03em}
.stat .k{font-size:12px; color:var(--muted); margin-top:7px}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}

/* ---------- facts ---------- */
.facts{margin-top:14px; padding:4px 20px}
.facts dl{display:grid; grid-template-columns:210px 1fr; margin:0}
.facts dt{padding:11px 0; font-size:12.5px; color:var(--muted); border-top:1px solid var(--line)}
.facts dd{padding:11px 0; margin:0; font-size:14px; border-top:1px solid var(--line)}
.facts dl>dt:first-of-type,.facts dl>dt:first-of-type+dd{border-top:0}
@media(max-width:640px){
  .facts dl{grid-template-columns:1fr}
  .facts dt{padding-bottom:0; border-top:1px solid var(--line)}
  .facts dd{padding-top:3px; border-top:0}
}

/* ---------- load chart ---------- */
.charts{display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); gap:14px; margin-top:14px}
@media(max-width:820px){.charts{grid-template-columns:1fr}}
.chart{padding:20px 22px 18px}
.chart h3{font-size:14px; margin-bottom:2px}
.chart .cap{font-size:12px; color:var(--muted); margin-bottom:20px}
.bars{display:grid; grid-template-columns:repeat(6,1fr); gap:10px; align-items:stretch; height:132px}
.bar{display:flex; flex-direction:column; justify-content:flex-end; height:100%; gap:6px}
.bar .col{border-radius:4px 4px 2px 2px; background:var(--accent); opacity:.86; position:relative}
.bar .col.on{opacity:1; box-shadow:inset 0 0 0 2px var(--gold)}
.bar .v{font-size:12px; text-align:center; color:var(--ink2)}
.bar-x{display:grid; grid-template-columns:repeat(6,1fr); gap:10px; margin-top:9px; padding-top:8px; border-top:1px solid var(--line)}
.bar-x span{font-size:11px; text-align:center; color:var(--muted)}
.split{display:flex; flex-direction:column; gap:13px}
.sp{display:grid; grid-template-columns:1fr auto; gap:4px 10px; align-items:baseline}
.sp .nm{font-size:13px}
.sp .nu{font-size:13px; color:var(--ink2)}
.sp .tr{grid-column:1/-1; height:6px; border-radius:99px; background:var(--sunk); overflow:hidden}
.sp .tr i{display:block; height:100%; border-radius:99px}
.sp .sub{grid-column:1/-1; font-size:11.5px; color:var(--muted)}

/* ---------- calendar ---------- */
.cal{margin-top:6px; overflow:hidden}
.tri-h{
  display:flex; align-items:center; gap:12px; padding:13px 20px;
  background:var(--surface2); border-top:1px solid var(--line); border-bottom:1px solid var(--line);
}
.tri-h:first-child{border-top:0}
.tri-h b{font-size:14px; font-stretch:106%}
.tri-h .rng{font-size:12px; color:var(--muted); margin-left:auto}
.crow{display:grid; grid-template-columns:26px 1fr 210px 96px; gap:12px; align-items:center;
  padding:11px 20px; border-top:1px solid var(--line); font-size:14px}
.crow:first-of-type{border-top:0}
.crow .idx{font-size:11px; color:var(--muted)}
.crow .nm{color:var(--ink)}
.crow .dt{font-size:12.5px; color:var(--ink2); white-space:nowrap}
.crow .st{font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; text-align:right; color:var(--muted)}
.crow.past{color:var(--muted)}
.crow.past .nm{color:var(--muted)}
.crow.live{background:var(--gold-soft)}
.crow.live .st{color:var(--gold); font-weight:600}
.crow.key .nm{font-weight:600}
.crow.hol{grid-template-columns:26px 1fr; align-items:start}
.crow.hol .nm{font-size:13px; color:var(--ink2)}
.crow.hol .nm em{font-style:normal; color:var(--muted)}
@media(max-width:720px){
  .crow{grid-template-columns:22px 1fr; row-gap:3px}
  .crow .dt{grid-column:2}
  .crow .st{grid-column:2; text-align:left}
}

/* ---------- filters ---------- */
.filters{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:16px}
.chip{
  font:inherit; font-size:12px; font-weight:500; background:var(--surface); color:var(--ink2);
  border:1px solid var(--line); border-radius:99px; padding:6px 12px; cursor:pointer; transition:.15s;
}
.chip:hover{border-color:var(--line2)}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.fsep{width:1px; height:20px; background:var(--line)}
.search{
  font:inherit; font-size:13px; background:var(--surface); color:var(--ink);
  border:1px solid var(--line); border-radius:99px; padding:7px 14px; min-width:190px; flex:1;
}
.search::placeholder{color:var(--muted)}

/* ---------- course cards ---------- */
.courses{display:flex; flex-direction:column; gap:10px}
.cc{overflow:hidden}
.cc-head{
  display:grid; grid-template-columns:34px 1fr auto; gap:14px; align-items:start;
  width:100%; text-align:left; background:none; border:0; font:inherit; color:inherit;
  padding:16px 18px; cursor:pointer;
}
.cc-head:hover{background:var(--surface2)}
.cc-n{font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--muted); padding-top:3px}
.cc-t{min-width:0}
.cc-t h3{font-size:16px; line-height:1.28; font-stretch:104%}
.cc-t .alt{font-size:12.5px; color:var(--muted); margin-top:3px; font-family:"Newsreader",Georgia,serif}
.tags{display:flex; flex-wrap:wrap; gap:5px; margin-top:9px}
.tag{
  font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.04em;
  padding:2px 7px; border-radius:4px; background:var(--surface2); color:var(--ink2);
  border:1px solid var(--line);
}
.tag.cyc{color:#fff; border:0}
:root[data-theme="dark"] .tag.cyc{color:#0B1316}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.cyc{color:#0B1316}}
.tag.kv{background:var(--gold-soft); border-color:transparent; color:var(--gold)}
.tag.hb{background:var(--accent-soft); border-color:transparent; color:var(--accent-ink)}
.cc-m{display:flex; align-items:center; gap:16px; flex-shrink:0; padding-top:2px}
.cc-cr{text-align:right}
.cc-cr b{display:block; font-size:19px; font-weight:700; letter-spacing:-.02em; line-height:1}
.cc-cr span{font-size:10.5px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase}
.caret{width:11px; height:11px; border-right:1.6px solid var(--muted); border-bottom:1.6px solid var(--muted);
  transform:rotate(45deg); transition:transform .2s; margin-top:-4px}
.cc[open] .caret{transform:rotate(225deg); margin-top:2px}
@media(max-width:620px){.cc-head{grid-template-columns:1fr auto} .cc-n{display:none}}

.cc-body{border-top:1px solid var(--line); padding:4px 18px 22px}
.blk{padding-top:20px}
.blk-h{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--muted); margin-bottom:9px}
.kv{display:grid; grid-template-columns:150px 1fr; gap:6px 14px; font-size:13.5px}
.kv dt{color:var(--muted); font-size:12.5px}
.kv dd{margin:0; color:var(--ink)}
@media(max-width:560px){.kv{grid-template-columns:1fr; gap:1px 0} .kv dd{margin-bottom:9px}}
ul.lo{margin:0; padding-left:19px; display:flex; flex-direction:column; gap:6px}
ul.lo li{font-family:"Newsreader",Georgia,serif; font-size:15.5px; line-height:1.45; color:var(--ink2); max-width:74ch}
ul.lo li::marker{color:var(--line2)}
.topics{display:flex; flex-wrap:wrap; gap:6px}
.topic{font-size:12.5px; padding:4px 10px; border-radius:99px; background:var(--surface2);
  border:1px solid var(--line); color:var(--ink2)}
.books{margin:0; padding-left:19px; display:flex; flex-direction:column; gap:6px}
.books li{font-family:"Newsreader",Georgia,serif; font-size:14.5px; line-height:1.4; color:var(--ink2)}
.books li::marker{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--muted)}

table.t{width:100%; border-collapse:collapse; font-size:13px}
table.t th{
  font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted); font-weight:500; text-align:left; padding:0 10px 7px 0; border-bottom:1px solid var(--line);
}
table.t td{padding:8px 10px 8px 0; border-bottom:1px solid var(--line); vertical-align:top}
table.t tr:last-child td{border-bottom:0}
table.t .num{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; white-space:nowrap}
table.t .ct{font-weight:600}
.scroll{overflow-x:auto}
.hbar{display:flex; height:9px; border-radius:99px; overflow:hidden; border:1px solid var(--line); margin-bottom:9px}
.hbar i{display:block; height:100%}
.hleg{display:flex; flex-wrap:wrap; gap:14px; font-size:12px; color:var(--ink2)}
.hleg span{display:flex; align-items:center; gap:6px}
.dot{width:8px; height:8px; border-radius:2px; flex-shrink:0}
.formula{
  font-family:"IBM Plex Mono",monospace; font-size:13px; background:var(--accent-soft);
  color:var(--accent-ink); padding:9px 13px; border-radius:6px; display:inline-block;
}
.callout{
  border-left:3px solid var(--gold); background:var(--gold-soft); padding:13px 16px;
  border-radius:0 6px 6px 0; font-size:13.5px; color:var(--ink2);
}
.callout b{color:var(--ink)}

/* ---------- grade table ---------- */
.gcols{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px; margin-top:14px}
@media(max-width:800px){.gcols{grid-template-columns:1fr}}
.pad{padding:20px 22px}
.pad h3{font-size:15px; margin-bottom:14px}
.plist{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:11px}
.plist li{display:grid; grid-template-columns:16px 1fr; gap:10px; font-size:13.5px; color:var(--ink2)}
.plist .mk{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--warn); padding-top:2px}

/* ---------- sources ---------- */
.srcs{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:14px}
@media(max-width:800px){.srcs{grid-template-columns:1fr}}
.src{padding:18px 20px}
.src .fn{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--accent-ink); word-break:break-word}
.src h3{font-size:14px; margin:9px 0 6px}
.src p{font-size:12.5px; color:var(--muted); line-height:1.45}
footer{padding:44px 0 60px; margin-top:44px; border-top:1px solid var(--line); font-size:12px; color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>
</head><body>

<header class="topbar">
  <div class="wrap topbar-in">
    <div class="brand"><b>ADA</b><span data-ru="Магистратура · Astana IT University" data-en="MSc · Astana IT University"></span></div>
    <nav class="nav">
      <a href="#now" data-ru="Сейчас" data-en="Now"></a>
      <a href="#program" data-ru="Программа" data-en="Programme"></a>
      <a href="#calendar" data-ru="Календарь" data-en="Calendar"></a>
      <a href="#courses" data-ru="Курсы" data-en="Courses"></a>
      <a href="#grading" data-ru="Оценки" data-en="Grading"></a>
      <a href="#notes" data-ru="Нестыковки" data-en="Conflicts"></a>
    </nav>
    <div class="ctrls">
      <div class="seg" role="group" aria-label="Язык / Language">
        <button id="l-ru" aria-pressed="true">RU</button><button id="l-en" aria-pressed="false">EN</button>
      </div>
      <button class="btn" id="theme" aria-label="Тема">◐</button>
    </div>
  </div>
</header>

<main class="wrap">

<section id="now" style="padding-top:36px">
  <div class="card now">
    <div class="now-main">
      <div class="now-date mono" id="nowDate"></div>
      <h1 class="now-phase" id="nowPhase"></h1>
      <p class="now-sub" id="nowSub"></p>
      <div class="now-bar" id="nowBar"></div>
    </div>
    <div class="now-side">
      <div class="up-h" data-ru="Что дальше" data-en="What is next"></div>
      <ul class="up" id="upNext"></ul>
    </div>
  </div>
  <div class="stats" id="stats"></div>
</section>

<section id="program">
  <div class="sec-head">
    <span class="eyebrow" data-ru="Учебный план" data-en="Curriculum"></span>
    <h2 data-ru="Из чего состоит программа" data-en="What the programme is made of"></h2>
  </div>
  <div class="card facts" id="facts"></div>
  <div class="charts">
    <div class="card chart">
      <h3 data-ru="Нагрузка по триместрам" data-en="Load by trimester"></h3>
      <div class="cap" data-ru="Академические кредиты, всего 120 за 2 года. Рамкой отмечен текущий или ближайший триместр" data-en="Academic credits, 120 over 2 years. The outlined bar is the current or nearest trimester"></div>
      <div class="bars" id="bars"></div>
      <div class="bar-x" id="barsX"></div>
    </div>
    <div class="card chart">
      <h3 data-ru="Кредиты по циклам" data-en="Credits by cycle"></h3>
      <div class="cap" data-ru="ВК — вузовский компонент, КВ — по выбору" data-en="ВК — university component, КВ — elective"></div>
      <div class="split" id="split"></div>
    </div>
  </div>
</section>

<section id="calendar">
  <div class="sec-head">
    <span class="eyebrow" data-ru="2026–2027 · 1 курс" data-en="2026–2027 · Year 1"></span>
    <h2 data-ru="Академический календарь" data-en="Academic calendar"></h2>

var MON = {

  en:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]
};
function D(s){ var p = s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function fmt(s){ var d = D(s); return d.getDate()+" "+MON[L][d.getMonth()]+" "+d.getFullYear(); }
function fmtShort(s){ var d = D(s); return d.getDate()+" "+MON[L][d.getMonth()]; }
function range(a,b){ return fmtShort(a)+" — "+fmt(b); }
function days(a,b){ return Math.round((b-a)/86400000); }
function plural(n,f){ /* f = [1, 2-4, 5+] */
  var m10 = n%10, m100 = n%100;
  if(m10===1 && m100!==11) return f[0];
  if(m10>=2 && m10<=4 && (m100<12||m100>14)) return f[1];
  return f[2];
}
function inDays(n){
  if(L==="en") return n===1 ? "in 1 day" : "in "+n+" days";
  return "через "+n+" "+plural(n,["день","дня","дней"]);
}

/* ============ NOW ============ */
var TODAY = new Date(); TODAY.setHours(0,0,0,0);
var ALL_EV = PRE.slice();
TRI.forEach(function(t){ t.items.forEach(function(e){ ALL_EV.push(e); }); });
ALL_EV.sort(function(x,y){ return D(x.a) - D(y.a); });

function state(e){
  var a = D(e.a), b = D(e.b);
  if(TODAY > b) return "past";
  if(TODAY >= a) return "live";
  return "soon";
}

function renderNow(){
  var live = ALL_EV.filter(function(e){ return state(e)==="live"; });
  var soon = ALL_EV.filter(function(e){ return state(e)==="soon"; });
  var first = D(PRE[0].a), last = D(TRI[2].items[TRI[2].items.length-1].b);

  var phase, sub, bar = "";
  if(TODAY < first){
    var d = days(TODAY, first);
    phase = L==="ru" ? "Учёба ещё не началась" : "The year has not started yet";
    sub = (L==="ru"
      ? "Ознакомительная неделя стартует "+fmt(PRE[0].a)+" — "+inDays(d)+"."
      : "Induction week starts on "+fmt(PRE[0].a)+" — "+inDays(d)+".");
    var t1 = UP.filter(function(c){ return c.tri===1; });
    bar = '<div class="up-h" style="margin-top:4px">'
      + (L==="ru" ? "Первый триместр — "+t1.reduce(function(s,c){return s+c.cr;},0)+" кредитов"
                  : "Trimester one — "+t1.reduce(function(s,c){return s+c.cr;},0)+" credits")
      + '</div><ul class="up">'
      + t1.map(function(c){
          return '<li><span class="d mono" style="min-width:34px">'+c.cr+' '+esc(T(S.ectsShort))
            + '</span><span class="n">'+esc(T(c))+'</span>'
            + '<span class="in mono">'+esc(T(c.ctrl))+'</span></li>';
        }).join("") + '</ul>';
  } else if(TODAY > last){
    phase = L==="ru" ? "Первый курс пройден" : "Year one is complete";
    sub = L==="ru" ? "Календарь 2026–2027 закончился. Дальше — второй курс." : "The 2026–2027 calendar is over. Year two is next.";
  } else {
    var main = live.filter(function(e){ return e.kind==="key"; })[0] || live[0];
    phase = main ? T(main) : (L==="ru" ? "Между этапами" : "Between phases");
    if(main){
      var tot = days(D(main.a), D(main.b)) + 1, gone = days(D(main.a), TODAY) + 1;
      var pct = Math.max(2, Math.min(100, Math.round(gone/tot*100)));
      sub = range(main.a, main.b) + " · " + (L==="ru" ? "день "+gone+" из "+tot : "day "+gone+" of "+tot);
      bar = '<div class="track"><i style="width:'+pct+'%"></i></div>'
          + '<div class="track-lab"><span>'+fmtShort(main.a)+'</span><span>'+pct+'%</span><span>'+fmt(main.b)+'</span></div>';
    } else {
      sub = L==="ru" ? "Сейчас по календарю ничего не идёт." : "Nothing scheduled is running right now.";
    }
    if(live.length > 1){
      var others = live.filter(function(e){ return e !== main; })
        .map(function(e){ return T(e); }).join(" · ");
      sub += (L==="ru" ? " · Параллельно: " : " · Also running: ") + others;
    }
  }

  document.getElementById("nowDate").textContent =
    (L==="ru" ? "Сегодня " : "Today ") + fmt(
      TODAY.getFullYear()+"-"+String(TODAY.getMonth()+1).padStart(2,"0")+"-"+String(TODAY.getDate()).padStart(2,"0"));
  document.getElementById("nowPhase").textContent = phase;
  document.getElementById("nowSub").textContent = sub;
  document.getElementById("nowBar").innerHTML = bar;

  document.getElementById("upNext").innerHTML = soon.slice(0,6).map(function(e){
    var d = days(TODAY, D(e.a));
    return '<li><span class="d mono">'+fmtShort(e.a)+'</span><span class="n">'+esc(T(e))
      +'</span><span class="in mono">'+(d===0 ? (L==="ru"?"сегодня":"today") : inDays(d))+'</span></li>';
  }).join("") || '<li><span class="n">'+(L==="ru"?"Впереди по календарю ничего не осталось.":"Nothing left ahead in this calendar.")+'</span></li>';
}

  o += loBlock(L==="ru"?"Знания: студент будет владеть":"Knowledge: the student will show a working knowledge in", m.know);

    o += '<div class="blk"><div class="blk-h">'+(L==="ru"?"Содержание курса":"Course content")+'</div><div class="topics">'
      + m.topics.map(function(x){ return '<span class="topic">'+esc(T(x))+'</span>'; }).join("") + '</div></div>';
  }

    o += '<div class="blk"><div class="blk-h">'+(L==="ru"?"О чём курс":"What the course is about")+'</div>'

function upCard(c){

    + '<span class="tag'+(c.comp==="КВ"?" kv":"")+'">'+(c.comp==="КВ"
        ? (L==="ru"?"по выбору":"elective") : (L==="ru"?"обязательный":"required"))+'</span>'

    + '<span class="tag">'+esc(T(c.ctrl))+'</span>'

    + (c.hb.length ? '<span class="tag hb">'+(L==="ru"?"есть в хендбуке":"in handbook")+'</span>'

    + '<dt>'+(L==="ru"?"Код дисциплины":"Course code")+'</dt><dd class="mono">'+esc(c.code)+'</dd>'
    + '<dt>'+(L==="ru"?"Цикл / компонент":"Cycle / component")+'</dt><dd>'+c.cyc+' / '+c.comp+'</dd>'
    + '<dt>'+(L==="ru"?"Триместр":"Trimester")+'</dt><dd>'+c.tri+'</dd>'
    + '<dt>'+(L==="ru"?"Форма контроля":"Control form")+'</dt><dd>'+esc(T(c.ctrl))+'</dd>'
    + '<dt>'+(L==="ru"?"Кредиты":"Credits")+'</dt><dd class="mono">'+c.cr+'</dd>'
    + '<dt>'+(L==="ru"?"На английском":"In English")+'</dt><dd>'+esc(c.en)+'</dd>'
    + '<dt>'+(L==="ru"?"Қазақша":"In Kazakh")+'</dt><dd>'+esc(c.kk)+'</dd>'

  if(c.note) body += '<div class="blk"><div class="callout">'+esc(T(c.note))+'</div></div>';

function renderFilters(){
  var f = '<div class="filters-row" style="display:contents">';
  f += '<button class="chip" data-f="tri" data-v="0" aria-pressed="'+(F_TRI===0)+'">'+(L==="ru"?"Все триместры":"All trimesters")+'</button>';
  for(var i=1;i<=6;i++) f += '<button class="chip mono" data-f="tri" data-v="'+i+'" aria-pressed="'+(F_TRI===i)+'">'+(L==="ru"?"Т":"T")+i+'</button>';
  f += '<span class="fsep"></span>';
  f += '<button class="chip" data-f="cyc" data-v="" aria-pressed="'+(F_CYC==="")+'">'+(L==="ru"?"Все циклы":"All cycles")+'</button>';
  ["БД","ПД","НИР","ИА"].forEach(function(c){
    f += '<button class="chip" data-f="cyc" data-v="'+c+'" aria-pressed="'+(F_CYC===c)+'">'+c+'</button>';
  });
  f += '<span class="fsep"></span>';
  f += '<button class="chip" data-f="src" data-v="up" aria-pressed="'+(F_SRC==="up")+'">'+(L==="ru"?"Только учебный план":"Curriculum only")+'</button>';
  f += '<button class="chip" data-f="src" data-v="hb" aria-pressed="'+(F_SRC==="hb")+'">'+(L==="ru"?"Только хендбук":"Handbook only")+'</button>';
  f += '<input class="search" id="q" type="search" placeholder="'+(L==="ru"?"Поиск по названию или коду…":"Search by name or code…")+'" value="'+esc(Q)+'">';
  f += '</div>';
  document.getElementById("filters").innerHTML = f;

  document.getElementById("filters").querySelectorAll(".chip").forEach(function(b){
    b.addEventListener("click", function(){
      var k = b.dataset.f, v = b.dataset.v;
      if(k==="tri") F_TRI = +v;
      else if(k==="cyc") F_CYC = v;
      else F_SRC = (F_SRC===v ? "" : v);
      renderFilters(); applyFilter();
    });
  });
  var q = document.getElementById("q");
  q.addEventListener("input", function(){ Q = q.value.trim().toLowerCase(); applyFilter(); });
}

function applyFilter(){
  var n = 0;
  document.querySelectorAll("#courseList .cc").forEach(function(el){
    var ok = true;
    if(F_TRI && +el.dataset.tri !== F_TRI) ok = false;
    if(F_CYC && el.dataset.cyc !== F_CYC) ok = false;
    if(F_SRC && el.dataset.src !== F_SRC) ok = false;
    if(Q && el.dataset.q.indexOf(Q) === -1) ok = false;
    el.style.display = ok ? "" : "none";
    if(ok) n++;
  });
  document.getElementById("ccount").textContent = L==="ru"
    ? "показано "+n+" "+plural(n,["курс","курса","курсов"])
    : n+" shown";
}

function renderCourses(){
  document.getElementById("courseList").innerHTML =
    UP.map(upCard).join("") + EXTRA.map(extraCard).join("");
  renderFilters();
  applyFilter();
}

function applyStatic(){
  document.querySelectorAll("[data-ru]").forEach(function(el){
    el.textContent = L==="ru" ? el.dataset.ru : el.dataset.en;
  });
  document.documentElement.lang = L;
}
function renderAll(){
  applyStatic(); renderNow(); renderProgram(); renderCal(); renderCourses(); renderGrading(); renderNotes();
}
function setLang(l){
  L = l;
  document.getElementById("l-ru").setAttribute("aria-pressed", String(l==="ru"));
  document.getElementById("l-en").setAttribute("aria-pressed", String(l==="en"));
  try{ localStorage.setItem("ada-lang", l); }catch(e){}
  renderAll();
}
document.getElementById("l-ru").addEventListener("click", function(){ setLang("ru"); });
document.getElementById("l-en").addEventListener("click", function(){ setLang("en"); });

document.getElementById("theme").addEventListener("click", function(){
  var cur = document.documentElement.getAttribute("data-theme");
  var next = cur === "dark" ? "light" : cur === "light" ? "" : "dark";
  if(next) document.documentElement.setAttribute("data-theme", next);
  else document.documentElement.removeAttribute("data-theme");
  try{ localStorage.setItem("ada-theme", next); }catch(e){}
});

(function init(){
  var l = "ru", th = null;
  try{ l = localStorage.getItem("ada-lang") || "ru"; th = localStorage.getItem("ada-theme"); }catch(e){}
  if(th) document.documentElement.setAttribute("data-theme", th);
  setLang(l === "en" ? "en" : "ru");
})();
